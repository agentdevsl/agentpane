name: Mutation Testing

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/state-machines/**'
      - 'src/services/rbac.service.ts'
      - 'src/services/rbac-token.service.ts'
      - 'src/lib/api/auth-middleware.ts'
      - 'src/lib/api/rbac-middleware.ts'
      - 'tests/services/rbac*.test.ts'
      - 'tests/lib/api/rbac-middleware.test.ts'
      - 'tests/routes/rbac-tokens.test.ts'
  schedule:
    - cron: '0 4 * * 1-5'
  workflow_dispatch:

env:
  BUN_VERSION: '1.3.10'

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - area: agent-lifecycle
            mutate: 'src/lib/state-machines/agent-lifecycle/machine.ts,src/lib/state-machines/agent-lifecycle/guards.ts,src/lib/state-machines/agent-lifecycle/actions.ts'
          - area: task-workflow
            mutate: 'src/lib/state-machines/task-workflow/machine.ts,src/lib/state-machines/task-workflow/guards.ts'
          - area: session-lifecycle
            mutate: 'src/lib/state-machines/session-lifecycle/machine.ts,src/lib/state-machines/session-lifecycle/guards.ts'
          - area: worktree-lifecycle
            mutate: 'src/lib/state-machines/worktree-lifecycle/machine.ts,src/lib/state-machines/worktree-lifecycle/guards.ts'
          - area: rbac
            mutate: 'src/services/rbac.service.ts,src/services/rbac-token.service.ts,src/lib/api/auth-middleware.ts,src/lib/api/rbac-middleware.ts'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache node_modules
        id: cache-modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Restore Stryker incremental cache
        uses: actions/cache@v5
        with:
          path: reports/mutation/stryker-incremental.json
          key: stryker-incremental-${{ matrix.area }}-${{ github.base_ref || 'main' }}-${{ hashFiles('src/lib/state-machines/**', 'src/services/rbac*.ts', 'src/lib/api/auth-middleware.ts', 'src/lib/api/rbac-middleware.ts') }}
          restore-keys: |
            stryker-incremental-${{ matrix.area }}-${{ github.base_ref || 'main' }}-
            stryker-incremental-${{ matrix.area }}-main-

      - name: Mutation test (${{ matrix.area }})
        run: npx stryker run --mutate '${{ matrix.mutate }}' --reporters clear-text
        continue-on-error: true

      - name: Save Stryker incremental cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: reports/mutation/stryker-incremental.json
          key: stryker-incremental-${{ matrix.area }}-${{ github.base_ref || 'main' }}-${{ hashFiles('src/lib/state-machines/**', 'src/services/rbac*.ts', 'src/lib/api/auth-middleware.ts', 'src/lib/api/rbac-middleware.ts') }}

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ matrix.area }}
          path: reports/mutation/
          retention-days: 14
