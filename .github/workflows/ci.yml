name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BUN_VERSION: '1.3.10'
  # Bump to invalidate stale node_modules / bun package caches.
  CACHE_VERSION: v2

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache node_modules
        id: cache-modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/package.json') }}

      - name: Cache Bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-packages-${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            bun-packages-${{ env.CACHE_VERSION }}-${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: install
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        uses: ./.github/actions/setup-bun-env
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Schema drift check
        run: bun run scripts/check-schema-drift.ts

      - name: Supply-chain check (arch29-W1-C / F04-01, F04-02, F04-11)
        run: bash scripts/check-supply-chain.sh

      - name: API write validation gate (arch29-W2-H / F07-03)
        run: bash scripts/check-api-write-validation.sh

      - name: Type check
        run: bun run typecheck

      - name: Lint and Format Check
        run: bun run check

      - name: Knip (unused files + dependencies)
        run: bun run knip --include files --include dependencies

      - name: Dependency audit (gated by allowlist)
        run: bun scripts/check-audit.ts

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: install
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        uses: ./.github/actions/setup-bun-env
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Test (shard ${{ matrix.shard }})
        run: bun vitest run --project unit --project jsdom --project db --shard=${{ matrix.shard }}

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-shard-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: install
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        uses: ./.github/actions/setup-bun-env
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install agent-runner dependencies
        run: cd agent-runner && bun install --frozen-lockfile

      - name: Build verification
        run: bun run build

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: install
    steps:
      - uses: actions/checkout@v6

      - name: Install Semgrep
        run: pip install semgrep

      - name: Semgrep scan (blocking - ERROR severity)
        run: |
          semgrep scan \
            --config .semgrep/rules/ \
            --severity ERROR \
            --error \
            --exclude 'tests/**' \
            --exclude '**/__tests__/**' \
            --exclude '**/*.test.ts' \
            --exclude '**/*.spec.ts' \
            --exclude 'node_modules/**' \
            --exclude 'dist/**' \
            --exclude '.worktrees/**' \
            src/ agent-runner/src/ packages/

      - name: Semgrep scan (non-blocking - WARNING severity)
        if: always()
        continue-on-error: true
        run: |
          semgrep scan \
            --config .semgrep/rules/ \
            --severity WARNING \
            --exclude 'tests/**' \
            --exclude '**/__tests__/**' \
            --exclude '**/*.test.ts' \
            --exclude '**/*.spec.ts' \
            --exclude 'node_modules/**' \
            --exclude 'dist/**' \
            --exclude '.worktrees/**' \
            src/ agent-runner/src/ packages/

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: install
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        uses: ./.github/actions/setup-bun-env
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: E2E smoke — task creation + agent auto-start golden path
        run: bun vitest run --project functional tests/functional/smoke.test.ts

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: install
    # Non-blocking for the first week of data; flip to hard gate once thresholds
    # prove stable. See vitest.config.ts `thresholds` block.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        uses: ./.github/actions/setup-bun-env
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Test with coverage (unit + jsdom + db)
        run: bun vitest run --project unit --project jsdom --project db --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test, lint-and-typecheck, build, semgrep, e2e-smoke]
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        uses: ./.github/actions/setup-bun-env
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Integration tests (shard ${{ matrix.shard }})
        run: bun vitest run --project integration --project functional --shard=${{ matrix.shard }}

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results-shard-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7
