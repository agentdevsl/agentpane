name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BUN_VERSION: '1.3.10'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache node_modules
        id: cache-modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/package.json') }}

      - name: Cache Bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-packages-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            bun-packages-${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: install
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        uses: ./.github/actions/setup-bun-env
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Schema drift check
        run: bun run scripts/check-schema-drift.ts

      - name: Type check
        run: bun run typecheck

      - name: Lint and Format Check
        run: bun run check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: install
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        uses: ./.github/actions/setup-bun-env
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Dependency audit
        run: bun pm audit 2>/dev/null || echo "::warning::Dependency audit found issues (non-blocking)"
        continue-on-error: true

      - name: Test (shard ${{ matrix.shard }})
        run: bun vitest run --project unit --project jsdom --project db --shard=${{ matrix.shard }}

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-shard-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: install
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        uses: ./.github/actions/setup-bun-env
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install agent-runner dependencies
        run: cd agent-runner && bun install --frozen-lockfile

      - name: Build verification
        run: bun run build

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: install
    steps:
      - uses: actions/checkout@v6

      - name: Install Semgrep
        run: pip install semgrep

      - name: Semgrep scan (blocking - ERROR severity)
        run: |
          semgrep scan \
            --config .semgrep/rules/ \
            --severity ERROR \
            --error \
            --exclude 'tests/**' \
            --exclude '**/__tests__/**' \
            --exclude '**/*.test.ts' \
            --exclude '**/*.spec.ts' \
            --exclude 'node_modules/**' \
            --exclude 'dist/**' \
            --exclude '.worktrees/**' \
            src/ agent-runner/src/ packages/

      - name: Semgrep scan (non-blocking - WARNING severity)
        if: always()
        continue-on-error: true
        run: |
          semgrep scan \
            --config .semgrep/rules/ \
            --severity WARNING \
            --exclude 'tests/**' \
            --exclude '**/__tests__/**' \
            --exclude '**/*.test.ts' \
            --exclude '**/*.spec.ts' \
            --exclude 'node_modules/**' \
            --exclude 'dist/**' \
            --exclude '.worktrees/**' \
            src/ agent-runner/src/ packages/

  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test, lint-and-typecheck, build, semgrep]
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        uses: ./.github/actions/setup-bun-env
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Integration tests (shard ${{ matrix.shard }})
        run: bun vitest run --project integration --project functional --shard=${{ matrix.shard }}

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results-shard-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7
