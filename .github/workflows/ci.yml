name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BUN_VERSION: '1.3.10'
  # Bump to invalidate stale node_modules / bun package caches.
  CACHE_VERSION: v2

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache node_modules
        id: cache-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/package.json') }}

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-packages-${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            bun-packages-${{ env.CACHE_VERSION }}-${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: install
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        uses: ./.github/actions/setup-bun-env
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Schema drift check
        run: bun run scripts/check-schema-drift.ts

      - name: Supply-chain check (arch29-W1-C / F04-01, F04-02, F04-11)
        run: bash scripts/check-supply-chain.sh

      - name: API write validation gate (arch29-W2-H / F07-03)
        run: bash scripts/check-api-write-validation.sh

      - name: Test discipline gate (arch29-W2-S / F09-23, F09-32)
        run: bash scripts/check-test-discipline.sh

      - name: Frontend design-token gate (arch29-W3-C / F08-01, F08-02)
        run: bash scripts/check-frontend-tokens.sh

      - name: Type check
        run: bun run typecheck

      - name: Lint and Format Check
        run: bun run check

      - name: Knip (unused files + dependencies)
        run: bun run knip --include files --include dependencies

      - name: Dependency audit (gated by allowlist)
        run: bun scripts/check-audit.ts

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: install
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        uses: ./.github/actions/setup-bun-env
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Test (shard ${{ matrix.shard }})
        run: bun vitest run --project unit --project jsdom --project db --shard=${{ matrix.shard }}

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-shard-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: install
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        uses: ./.github/actions/setup-bun-env
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install agent-runner dependencies
        run: cd agent-runner && bun install --frozen-lockfile

      # F11-15: Fail the build if a stray npm lockfile resurfaces in the
      # agent-runner workspace. Two lockfiles drift silently — CI uses
      # `bun install --frozen-lockfile` against bun.lock, but the Dockerfiles
      # historically used `npm install` against package-lock.json, building
      # and CI tested different graphs. bun.lock is the only source of truth.
      - name: Enforce single lockfile in agent-runner
        run: |
          if [ -f agent-runner/package-lock.json ]; then
            echo "ERROR: agent-runner/package-lock.json must not be checked in." >&2
            echo "       The agent-runner workspace uses bun.lock as the single" >&2
            echo "       source of truth (see CLAUDE.md 'agent-runner Lockfile')." >&2
            exit 1
          fi

      - name: Build verification
        run: bun run build

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: install
    steps:
      - uses: actions/checkout@v6

      - name: Install Semgrep
        run: pip install semgrep

      - name: Semgrep scan (blocking - ERROR severity)
        run: |
          semgrep scan \
            --config .semgrep/rules/ \
            --severity ERROR \
            --error \
            --exclude 'tests/**' \
            --exclude '**/__tests__/**' \
            --exclude '**/*.test.ts' \
            --exclude '**/*.spec.ts' \
            --exclude 'node_modules/**' \
            --exclude 'dist/**' \
            --exclude '.worktrees/**' \
            src/ agent-runner/src/ packages/

      - name: Semgrep scan (non-blocking - WARNING severity)
        if: always()
        continue-on-error: true
        run: |
          semgrep scan \
            --config .semgrep/rules/ \
            --severity WARNING \
            --exclude 'tests/**' \
            --exclude '**/__tests__/**' \
            --exclude '**/*.test.ts' \
            --exclude '**/*.spec.ts' \
            --exclude 'node_modules/**' \
            --exclude 'dist/**' \
            --exclude '.worktrees/**' \
            src/ agent-runner/src/ packages/

      # arch29-W2-S / F09-23 + F09-32 — test-discipline rules scoped to
      # `tests/`. The authoritative gate is `scripts/check-test-discipline.sh`
      # (run from `lint-and-typecheck`) which understands the
      # `// TEST-SETUP:` exemption that Semgrep cannot express. Semgrep's
      # default ignore list excludes `tests/`, so this rule file is primarily
      # an IDE-time hint; the bash script enforces in CI.
      - name: Semgrep scan — test discipline (advisory)
        if: always()
        continue-on-error: true
        run: |
          # Targets paths inside tests/ via explicit patterns. Semgrep's
          # default exclude of tests/ is overridden by passing each file
          # explicitly via xargs from `git ls-files`.
          test_files=$(git ls-files 'tests/functional/*.test.ts' 'tests/integration/*.test.ts' 'tests/services/*.test.ts' 2>/dev/null | head -200)
          if [ -z "$test_files" ]; then
            echo "::notice::No test files matched; skipping semgrep test-discipline scan."
            exit 0
          fi
          echo "$test_files" | xargs semgrep scan \
            --config .semgrep/rules/test-discipline.yml \
            --severity ERROR \
            --error \
            --no-git-ignore \
            --exclude 'node_modules/**' \
            --exclude '.worktrees/**'

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: install
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        uses: ./.github/actions/setup-bun-env
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: E2E smoke — task creation + agent auto-start golden path
        run: bun vitest run --project functional tests/functional/smoke.test.ts

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: install
    # Non-blocking for the first week of data; flip to hard gate once thresholds
    # prove stable. See vitest.config.ts `thresholds` block.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        uses: ./.github/actions/setup-bun-env
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: "Test with coverage (all projects: unit + jsdom + db + integration + functional)"
        run: bun vitest run --project unit --project jsdom --project db --project integration --project functional --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test, lint-and-typecheck, build, semgrep, e2e-smoke]
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        uses: ./.github/actions/setup-bun-env
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Integration tests (shard ${{ matrix.shard }})
        run: bun vitest run --project integration --project functional --shard=${{ matrix.shard }}

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results-shard-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7
