# F11-01: Continuous Delivery pipeline.
#
# Triggered on semver tags (`v*`), this workflow:
#   1. Builds the production app image for linux/amd64 + linux/arm64 via
#      buildx with BuildKit caching.
#   2. Scans the image with Trivy and fails the run on HIGH/CRITICAL findings.
#   3. Pushes the image to GHCR with both the tag version and the commit SHA.
#   4. Packages the Helm chart and attaches it to a GitHub Release.
#
# The workflow is intentionally free of custom composite actions so it can be
# inspected and `gh workflow view`'d without additional setup. It uses the
# `GITHUB_TOKEN` the runner already has for GHCR pushes, so operators only
# need to ensure Packages write permission is granted to the repo.
#
# To cut a release: `git tag v1.2.3 && git push origin v1.2.3`.

name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual trigger for staging builds (image is tagged with the SHA only).
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build'
        required: false
        default: 'main'

permissions:
  contents: write      # create releases and upload assets
  packages: write      # push to ghcr.io
  id-token: write      # cosign / provenance (future)

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build, scan, and push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image-digest: ${{ steps.push.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up QEMU for multi-arch
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push (multi-arch)
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan
        # Pinned to commit SHA for v0.35.0 (immutable, post-supply-chain-incident, GHSA-69fq-xp46-6x23).
        # Tag 0.35.0 published 2026-03-04 with GitHub immutable releases — see advisory at
        # https://github.com/aquasecurity/trivy/security/advisories/GHSA-69fq-xp46-6x23.
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library

  # F11-16: Build and push the agent-sandbox image. This is the runtime
  # security boundary for sandboxed agent execution. The repo at
  # ghcr.io/<owner>/agent-sandbox is independent of the main app image and
  # is referenced by SANDBOX_DEFAULTS.image (src/lib/sandbox/types.ts) by
  # digest. Operators rotate the digest after publish; see release notes.
  build-and-push-sandbox:
    name: Build, scan, and push (agent-sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image-digest: ${{ steps.push.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up QEMU for multi-arch
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/agent-sandbox
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push (multi-arch)
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.agent-sandbox
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=agent-sandbox
          cache-to: type=gha,mode=max,scope=agent-sandbox

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/agent-sandbox@${{ steps.push.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library

  # F11-16: Build and push the AgentCore image (ARM64 only — AWS Bedrock
  # AgentCore runs Firecracker microVMs on ARM64). The Dockerfile.agentcore
  # path uses --platform=linux/arm64 explicitly; we publish a single arch
  # image. Trivy still gates HIGH/CRITICAL on the ARM64 build.
  build-and-push-agentcore:
    name: Build, scan, and push (agentcore)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image-digest: ${{ steps.push.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up QEMU for multi-arch
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/agentpane-agentcore
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push (arm64)
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.agentcore
          platforms: linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=agentcore
          cache-to: type=gha,mode=max,scope=agentcore

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/agentpane-agentcore@${{ steps.push.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library

  package-helm-chart:
    name: Package Helm chart
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 10
    outputs:
      chart-filename: ${{ steps.package.outputs.filename }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Update chart dependencies
        run: helm dependency update charts/agentpane

      - name: Derive chart version
        id: chart-version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            CHART_VERSION="${GITHUB_REF_NAME#v}"
          else
            CHART_VERSION="0.0.0-$(git rev-parse --short HEAD)"
          fi
          echo "version=${CHART_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Package chart
        id: package
        run: |
          helm package charts/agentpane \
            --version "${{ steps.chart-version.outputs.version }}" \
            --app-version "${{ needs.build-and-push.outputs.image-tag }}" \
            --destination dist/
          FILENAME=$(ls dist/agentpane-*.tgz | head -n 1)
          echo "filename=${FILENAME}" >> "${GITHUB_OUTPUT}"
          echo "Packaged ${FILENAME}"

      - name: Upload chart artifact
        uses: actions/upload-artifact@v7
        with:
          name: helm-chart
          path: dist/*.tgz
          retention-days: 30

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-push, build-and-push-sandbox, build-and-push-agentcore, package-helm-chart]
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download chart artifact
        uses: actions/download-artifact@v8
        with:
          name: helm-chart
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.tgz
          generate_release_notes: true
          body: |
            ## AgentPane ${{ github.ref_name }}

            ### Images
            - App: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image-tag }}`
              - Digest: `${{ needs.build-and-push.outputs.image-digest }}`
            - Agent sandbox: `${{ env.REGISTRY }}/${{ github.repository_owner }}/agent-sandbox:${{ needs.build-and-push-sandbox.outputs.image-tag }}`
              - Digest: `${{ needs.build-and-push-sandbox.outputs.image-digest }}`
            - AgentCore (ARM64): `${{ env.REGISTRY }}/${{ github.repository_owner }}/agentpane-agentcore:${{ needs.build-and-push-agentcore.outputs.image-tag }}`
              - Digest: `${{ needs.build-and-push-agentcore.outputs.image-digest }}`

            > After cutting this release, rotate `SANDBOX_DEFAULTS.image` in
            > `src/lib/sandbox/types.ts` to the new agent-sandbox digest. Tag-only
            > references are rejected at the SandboxConfigService and Settings
            > PUT endpoint layers.

            ### Helm chart
            The chart asset is attached below. Install with:

            ```sh
            helm install agentpane ./agentpane-${{ needs.build-and-push.outputs.image-tag }}.tgz
            ```

            ### Rollback
            Use `helm rollback <release> <revision>` to revert to a previous chart revision.
