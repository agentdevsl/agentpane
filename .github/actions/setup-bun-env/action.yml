name: Setup Bun Environment
description: Checkout code, setup Bun, and restore node_modules + Bun package caches

inputs:
  bun-version:
    description: Bun version to install
    required: false
    default: '1.3.10'

outputs:
  cache-hit:
    description: Whether the node_modules cache was an exact hit
    value: ${{ steps.cache-modules.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Restore node_modules cache
      id: cache-modules
      uses: actions/cache@v5
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/package.json') }}
        restore-keys: |
          node-modules-${{ runner.os }}-

    - name: Restore Bun packages cache
      uses: actions/cache@v5
      with:
        path: ~/.bun/install/cache
        key: bun-packages-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/package.json') }}
        restore-keys: |
          bun-packages-${{ runner.os }}-
