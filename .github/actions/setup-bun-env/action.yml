name: Setup Bun Environment
description: Checkout code, setup Bun, and restore node_modules + Bun package caches

inputs:
  bun-version:
    description: Bun version to install
    required: false
    default: '1.3.10'
  cache-version:
    description: Cache version token; bump to invalidate stale caches
    required: false
    default: v2

outputs:
  cache-hit:
    description: Whether the node_modules cache was an exact hit
    value: ${{ steps.cache-modules.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Restore node_modules cache
      id: cache-modules
      uses: actions/cache@v5
      with:
        path: node_modules
        key: node-modules-${{ inputs.cache-version }}-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/package.json') }}

    - name: Restore Bun packages cache
      uses: actions/cache@v5
      with:
        path: ~/.bun/install/cache
        key: bun-packages-${{ inputs.cache-version }}-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/package.json') }}
        restore-keys: |
          bun-packages-${{ inputs.cache-version }}-${{ runner.os }}-

    - name: Install dependencies (cache miss fallback)
      if: steps.cache-modules.outputs.cache-hit != 'true'
      shell: bash
      run: bun install --frozen-lockfile
