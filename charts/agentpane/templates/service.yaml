apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentpane.fullname" . }}
  labels:
    {{- include "agentpane.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.durableStreams.sidecar.enabled }}
    # F11-02: expose the durable-streams-server port so SSE resume / replay is
    # reachable in-cluster (matches the Docker Compose topology).
    - port: {{ .Values.durableStreams.sidecar.port }}
      targetPort: streams
      protocol: TCP
      name: streams
    {{- end }}
  selector:
    {{- include "agentpane.selectorLabels" . | nindent 4 }}
