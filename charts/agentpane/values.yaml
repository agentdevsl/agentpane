# -- Number of replicas for the AgentPane deployment
replicaCount: 1

image:
  # -- Container image repository
  repository: agentpane/agentpane
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag (defaults to .Chart.AppVersion)
  tag: ""

# -- Image pull secrets for private registries
imagePullSecrets: []
# -- Override the release name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""

# -----------------------------------------------------------------------------
# Database Configuration
# -----------------------------------------------------------------------------
database:
  # -- Database mode (always "postgres" for Helm deployment)
  mode: postgres

  internal:
    # -- Deploy Bitnami PostgreSQL subchart
    enabled: true
    auth:
      # -- PostgreSQL username
      username: agentpane
      # -- PostgreSQL password (ignored if existingSecret is set)
      password: ""
      # -- PostgreSQL database name
      database: agentpane
      # -- Name of an existing Secret containing the password
      existingSecret: ""
      secretKeys:
        # -- Key in the existing Secret that contains the password
        passwordKey: "password"

  external:
    # -- Use an external PostgreSQL instance (when internal.enabled is false)
    enabled: false
    # -- Hostname of the external PostgreSQL server
    host: ""
    # -- Port of the external PostgreSQL server
    port: 5432
    # -- Username for the external PostgreSQL server
    username: ""
    # -- Password for the external PostgreSQL server (ignored if existingSecret is set)
    password: ""
    # -- Database name on the external PostgreSQL server
    database: agentpane
    # -- SSL mode for external connection (disable, require, verify-ca, verify-full)
    sslMode: "require"
    # -- Name of an existing Secret containing the full DATABASE_URL
    existingSecret: ""
    secretKeys:
      # -- Key in the existing Secret that contains DATABASE_URL
      urlKey: "DATABASE_URL"
      # -- Key in the existing Secret that contains the password (if not using full URL)
      passwordKey: "password"

# -----------------------------------------------------------------------------
# AI Credentials
# -----------------------------------------------------------------------------
ai:
  # -- Anthropic API key (ignored if existingSecret is set)
  anthropicApiKey: ""
  # -- Claude OAuth token (ignored if existingSecret is set)
  claudeOauthToken: ""
  # -- Name of an existing Secret containing AI credentials
  existingSecret: ""
  secretKeys:
    # -- Key in the existing Secret for the Anthropic API key
    anthropicApiKeyKey: "ANTHROPIC_API_KEY"
    # -- Key in the existing Secret for the Claude OAuth token
    claudeOauthTokenKey: "CLAUDE_OAUTH_TOKEN"

# -----------------------------------------------------------------------------
# GitHub Integration
# -----------------------------------------------------------------------------
github:
  # -- Enable GitHub integration
  enabled: false
  # -- GitHub App ID
  appId: ""
  # -- GitHub App name/slug
  appName: ""
  # -- GitHub OAuth client ID
  clientId: ""
  # -- GitHub OAuth client secret (ignored if existingSecret is set)
  clientSecret: ""
  # -- GitHub App private key in PEM format (ignored if existingSecret is set)
  privateKey: ""
  # -- GitHub webhook secret (ignored if existingSecret is set)
  webhookSecret: ""
  # -- Name of an existing Secret containing GitHub credentials
  existingSecret: ""
  secretKeys:
    # -- Key in the existing Secret for the client secret
    clientSecretKey: "GITHUB_CLIENT_SECRET"
    # -- Key in the existing Secret for the private key
    privateKeyKey: "GITHUB_PRIVATE_KEY"
    # -- Key in the existing Secret for the webhook secret
    webhookSecretKey: "GITHUB_WEBHOOK_SECRET"

# -----------------------------------------------------------------------------
# Application Configuration
# -----------------------------------------------------------------------------
config:
  # -- Node environment
  nodeEnv: production
  # -- Log level (debug, info, warn, error)
  logLevel: info
  # -- CORS allowed origin (required in production — set to your frontend URL)
  corsOrigin: ""
  # -- Custom Anthropic API base URL (empty = default https://api.anthropic.com)
  anthropicBaseUrl: ""
  # -- Maximum agent runtime in milliseconds (default: 7200000 = 2 hours)
  agentMaxRuntimeMs: ""

# -----------------------------------------------------------------------------
# Service Account
# -----------------------------------------------------------------------------
serviceAccount:
  # -- Create a ServiceAccount
  create: true
  # -- Annotations to add to the ServiceAccount
  annotations: {}
  # -- Name of the ServiceAccount (generated if not set)
  name: ""
  # -- Automount API credentials
  automountServiceAccountToken: true

# -----------------------------------------------------------------------------
# Pod Configuration
# -----------------------------------------------------------------------------
# -- Annotations to add to pods
podAnnotations: {}
# -- Labels to add to pods
podLabels: {}

podSecurityContext:
  # -- Run as non-root
  runAsNonRoot: true
  # -- Run as user ID (1000 = bun user in the container)
  runAsUser: 1000
  # -- Run as group ID
  runAsGroup: 1000
  # -- Filesystem group
  fsGroup: 1000
  # -- Seccomp profile type
  seccompProfile:
    type: RuntimeDefault

securityContext:
  # -- Disallow privilege escalation
  allowPrivilegeEscalation: false
  # -- Read-only root filesystem
  readOnlyRootFilesystem: true
  # -- Drop all capabilities
  capabilities:
    drop:
      - ALL

# -----------------------------------------------------------------------------
# Service
# -----------------------------------------------------------------------------
service:
  # -- Service type
  type: ClusterIP
  # -- Service port
  port: 3001

# -----------------------------------------------------------------------------
# Gateway API (HTTPRoute)
# -----------------------------------------------------------------------------
gateway:
  # -- Create an HTTPRoute resource
  enabled: false
  # -- Hostname for the HTTPRoute
  hostname: agentpane.example.com
  # -- Parent Gateway references
  parentRefs: []
  #   - name: my-gateway
  #     namespace: gateway-system
  #     sectionName: https
  # -- Additional annotations for the HTTPRoute
  annotations: {}
  # -- TLS configuration (handled by the Gateway, not the HTTPRoute)
  tls: {}

# -----------------------------------------------------------------------------
# Persistence (F11-06)
# -----------------------------------------------------------------------------
# Application data lives in an emptyDir by default. For any deployment where
# data must survive a rollout, set `persistence.enabled: true` to create a
# PersistentVolumeClaim that is mounted at /app/data.
#
# IMPORTANT: Running with DB_MODE=sqlite on Kubernetes is unsupported — SQLite
# does not tolerate concurrent replicas sharing a RWO volume, and the current
# Helm chart has no StatefulSet option. Use the Bitnami Postgres subchart
# (database.internal.enabled) or an external Postgres (database.external).
persistence:
  # -- Enable a PersistentVolumeClaim for /app/data
  enabled: false
  # -- Storage class (empty = cluster default)
  storageClass: ""
  # -- Access mode for the PVC
  accessMode: ReadWriteOnce
  # -- PVC size (durable streams + local scratch)
  size: 10Gi
  # -- Additional annotations for the PVC
  annotations: {}

# -----------------------------------------------------------------------------
# PodDisruptionBudget (F11-06)
# -----------------------------------------------------------------------------
# Without a PDB, voluntary disruption (node drain, autoscaler) can evict all
# replicas at once. Default of maxUnavailable=0 keeps at least one pod available
# during voluntary operations. Operators running at replicaCount=1 should set
# maxUnavailable=1 (the only workable option with a single replica).
podDisruptionBudget:
  # -- Create a PodDisruptionBudget for the Deployment
  enabled: true
  # -- Maximum number of pods that may be unavailable during voluntary disruptions
  maxUnavailable: 0
  # -- Minimum available pods (mutually exclusive with maxUnavailable)
  minAvailable: ""

# -----------------------------------------------------------------------------
# Deployment Strategy (F11-06)
# -----------------------------------------------------------------------------
deploymentStrategy:
  # -- RollingUpdate parameters. Default is surge-then-terminate so pods drain
  # gracefully without dropping availability.
  type: RollingUpdate
  maxSurge: 1
  maxUnavailable: 0

# -----------------------------------------------------------------------------
# Pre-upgrade Migration Hook (F11-05)
# -----------------------------------------------------------------------------
# A Helm pre-upgrade/pre-install Job applies migrations once before the
# Deployment rollout. App pods then only verify the schema is current — they
# do not apply migrations — avoiding the race at replicaCount >= 2.
migrationJob:
  # -- Create a pre-upgrade/pre-install Job that runs migrate:run-only
  enabled: true
  # -- Deadline for the migration Job (Helm waits for it to complete before rolling out)
  activeDeadlineSeconds: 900
  # -- Number of times the Job is retried on failure
  backoffLimit: 2
  # -- Resource requests/limits for the migration Pod (small, one-shot)
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# -----------------------------------------------------------------------------
# Durable Streams Sidecar (F11-02)
# -----------------------------------------------------------------------------
# The app image starts Caddy (`durable-streams-server`) and the Bun API as two
# processes inside the same container (see `docker/start.sh`). In Kubernetes we
# keep the same topology but expose port 3000 (Caddy) on the Service so SSE
# resume / replay is reachable. When `durableStreams.sidecar.enabled` is true
# the Service targets port 3000 and liveness/readiness/startup probes against
# the app container continue to hit the Bun API on 3001. Disable only if you
# run durable-streams-server as a separate chart.
durableStreams:
  sidecar:
    # -- Include durable-streams-server (ships inside the app image) in the
    # Service topology. Default true to match the Docker Compose behaviour.
    enabled: true
    # -- Port the durable-streams-server (Caddy) listens on inside the container
    port: 3000
    # -- Data directory passed as STREAMS_DATA_DIR to the app container
    dataDir: /app/data/streams

# -----------------------------------------------------------------------------
# Resources
# -----------------------------------------------------------------------------
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# -----------------------------------------------------------------------------
# Autoscaling
# -----------------------------------------------------------------------------
autoscaling:
  # -- Enable Horizontal Pod Autoscaler
  enabled: false
  # -- Minimum replicas
  minReplicas: 1
  # -- Maximum replicas
  maxReplicas: 5
  # -- Target CPU utilization percentage
  targetCPUUtilizationPercentage: 80
  # -- Target memory utilization percentage
  targetMemoryUtilizationPercentage: 80

# -----------------------------------------------------------------------------
# Probes
# -----------------------------------------------------------------------------
livenessProbe:
  httpGet:
    path: /api/healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /api/healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 30

# -----------------------------------------------------------------------------
# Node Scheduling
# -----------------------------------------------------------------------------
# -- Node selector labels
nodeSelector: {}
# -- Tolerations
tolerations: []
# -- Affinity rules
affinity: {}
# -- Topology spread constraints
topologySpreadConstraints: []

# -----------------------------------------------------------------------------
# Agent Sandbox Configuration (Kubernetes CRD Mode)
# Uses the agents.x-k8s.io/v1alpha1 Agent Sandbox CRD controller.
# Prerequisites:
#   1. Install Agent Sandbox CRDs: kubectl apply -f k8s/manifests/crds.yaml
#   2. Deploy the agent-sandbox controller to the cluster
# Sandbox provider settings are stored in the database (sandbox.defaults,
# sandbox.kubernetes keys) and can be managed via the Settings UI.
# -----------------------------------------------------------------------------
sandbox:
  # -- Enable agent sandbox pod management and RBAC
  enabled: true

  # -- Sandbox provider type (kubernetes or docker). When set to "kubernetes",
  # the app will use the Agent Sandbox CRD provider; "docker" uses local Docker.
  # This is the default provider written to the database on first startup.
  provider: kubernetes

  image:
    # -- Agent sandbox container image repository
    repository: agentpane/agent-sandbox
    # -- Image pull policy for sandbox pods
    pullPolicy: IfNotPresent
    # -- Overrides the sandbox image tag
    tag: ""

  # -- Namespace for agent sandbox pods
  namespace: agentpane-sandboxes

  # -- Maximum concurrent agent pods
  maxConcurrentPods: 10

  # -- Runtime class for sandbox isolation (gvisor, kata, or none)
  runtimeClassName: "none"

  warmPool:
    # -- Enable pre-warmed sandbox pool for fast allocation
    enabled: false
    # -- Number of pre-warmed sandboxes to maintain
    size: 2

  kubeConfig:
    # -- Kubernetes context to use (empty = current context)
    context: ""
    # -- Skip TLS verification (for self-signed certs in minikube/kind)
    skipTLSVerify: false

  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 8Gi

  ephemeralPvc:
    # -- Storage class for ephemeral agent PVCs (empty = cluster default)
    storageClass: ""
    # -- Size of each ephemeral agent PVC
    size: 10Gi
    # -- Access mode for ephemeral PVCs
    accessMode: ReadWriteOnce

  networkPolicy:
    # -- Create network policies for sandbox namespace
    enabled: true
    # -- Allow egress to external HTTPS (required for Anthropic API, package managers)
    allowHttps: true
    # -- Allow egress for Git over SSH
    allowGitSsh: true
    # -- Additional egress CIDR blocks to allow
    additionalEgressCidrs: []

  resourceQuota:
    # -- Create resource quota for sandbox namespace
    enabled: true
    # -- Maximum number of agent pods
    maxPods: 20
    # -- Maximum number of PVCs
    maxPvcs: 20
    # -- Total CPU request limit across all sandbox pods
    totalCpuRequests: "16"
    # -- Total memory request limit across all sandbox pods
    totalMemoryRequests: 32Gi

  limitRange:
    # -- Create limit range for sandbox namespace
    enabled: true
    # -- Maximum CPU per container
    maxCpu: "8"
    # -- Maximum memory per container
    maxMemory: 16Gi
    # -- Minimum CPU per container
    minCpu: 100m
    # -- Minimum memory per container
    minMemory: 256Mi

# -----------------------------------------------------------------------------
# OpenShift Routes
# -----------------------------------------------------------------------------
route:
  # -- Create an OpenShift Route for the main app UI (requires openshift.enabled)
  enabled: false
  # -- Hostname for the app Route (internal users access AgentPane here)
  hostname: "agentpane.apps.example.com"

webhookRoute:
  # -- Create a dedicated OpenShift Route for GitHub webhook ingress (requires openshift.enabled)
  enabled: false
  # -- Hostname for the webhook Route (exposed to GitHub via firewall rule)
  hostname: "webhooks.agentpane.apps.example.com"

# -----------------------------------------------------------------------------
# Egress Proxy (for private-network deployments)
# -----------------------------------------------------------------------------
proxy:
  # -- HTTPS proxy URL (e.g. http://proxy.corp:8080). Required for reaching
  #    github.com, api.github.com, api.anthropic.com from a private network.
  httpsProxy: ""
  # -- HTTP proxy URL (defaults to httpsProxy if not set)
  httpProxy: ""
  # -- Comma-separated list of hosts/CIDRs to bypass the proxy
  noProxy: "localhost,127.0.0.1,.svc,.cluster.local"

# -----------------------------------------------------------------------------
# OpenShift Compatibility
# -----------------------------------------------------------------------------
openshift:
  # -- Enable OpenShift-specific resources (auto-detected if not set)
  enabled: false
  # -- Create SecurityContextConstraints
  createSCC: true

# -----------------------------------------------------------------------------
# Bitnami PostgreSQL Subchart Overrides
# -----------------------------------------------------------------------------
postgresql:
  auth:
    username: agentpane
    password: ""
    database: agentpane
    existingSecret: ""
    secretKeys:
      adminPasswordKey: "postgres-password"
      userPasswordKey: "password"
  primary:
    persistence:
      enabled: true
      size: 20Gi
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
