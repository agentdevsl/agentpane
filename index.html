<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AgentPane</title>
    <!-- Theme initialization - runs before React to prevent flash -->
    <script>
      (function() {
        var theme = localStorage.getItem('theme') || 'dark';
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        // Migrate legacy 'system' to explicit preference to avoid light-on-dark contrast issues
        if (theme === 'system') { theme = prefersDark ? 'dark' : 'light'; localStorage.setItem('theme', theme); }
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/client.tsx"></script>
  </body>
</html>
