<!-- Dual-write box -->
<rect x="50" y="1062" width="350" height="92" rx="8" fill="#161b22" stroke="#7ee787" stroke-width="1.5"/>
<text x="225" y="1084" text-anchor="middle" fill="#7ee787" font-size="12" font-weight="600">Dual-Write Pattern</text>
<text x="65" y="1104" fill="#3fb950" font-size="10" font-weight="600">1. SQLite (source of truth)</text>
<text x="250" y="1104" fill="#8b949e" font-size="10">-> persisted first, always available</text>
<text x="65" y="1122" fill="#bc8cff" font-size="10" font-weight="600">2. Caddy/LMDB (real-time)</text>
<text x="260" y="1122" fill="#8b949e" font-size="10">-> on-disk SSE stream delivery</text>
<text x="65" y="1140" fill="#8b949e" font-size="10">LMDB enables offset-based resume after reconnect</text>

<!-- Replay box -->
<rect x="420" y="1062" width="320" height="92" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
<text x="580" y="1084" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="600">Historical Replay</text>
<text x="435" y="1104" fill="#8b949e" font-size="10">Page refresh -> hydrate from SQLite</text>
<text x="435" y="1122" fill="#8b949e" font-size="10">API: GET /api/sessions/:id/events</text>
<text x="435" y="1140" fill="#8b949e" font-size="10">Ordered by offset ASC, paginated</text>

<!-- Resume box -->
<rect x="760" y="1062" width="340" height="92" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
<text x="930" y="1084" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="600">Offset-Based Resume</text>
<text x="775" y="1104" fill="#8b949e" font-size="10">Client tracks lastCursor (opaque string offset)</text>
<text x="775" y="1122" fill="#8b949e" font-size="10">On reconnect: pass offset to Caddy SSE</text>
<text x="775" y="1140" fill="#8b949e" font-size="10">No duplicate events, no gaps</text>

<!-- Exactly-once box -->
<rect x="1120" y="1062" width="340" height="92" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
<text x="1290" y="1084" text-anchor="middle" fill="#bc8cff" font-size="12" font-weight="600">Exactly-Once Semantics</text>
<text x="1135" y="1104" fill="#8b949e" font-size="10">IdempotentProducer: dedup on server side</text>
<text x="1135" y="1122" fill="#8b949e" font-size="10">UNIQUE(sessionId, offset) in SQLite</text>
<text x="1135" y="1140" fill="#8b949e" font-size="10">Offset collision retry (5 attempts)</text>

<!-- Reconnection box -->
<rect x="1480" y="1062" width="390" height="92" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
<text x="1675" y="1084" text-anchor="middle" fill="#f85149" font-size="12" font-weight="600">Auto-Reconnection</text>
<text x="1495" y="1104" fill="#8b949e" font-size="10">Exponential backoff: 1s -> 2s -> 4s -> ... -> 30s max</text>
<text x="1495" y="1122" fill="#8b949e" font-size="10">Max 8 attempts on clean closure</text>
<text x="1495" y="1140" fill="#8b949e" font-size="10">NOT_FOUND, UNAUTHORIZED, FORBIDDEN -> no retry</text>
