<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentPane Architecture Explorer</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0a0e1a; color: #c8cdd5;
  font-family: system-ui, -apple-system, sans-serif;
  height: 100vh; display: flex; flex-direction: column; overflow: hidden;
}

/* Top Bar */
.top-bar {
  background: #111827; border-bottom: 1px solid #1f2937;
  padding: 6px 14px; display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  z-index: 10;
}
.top-bar h1 { font-size: 13px; font-weight: 700; color: #f1f5f9; letter-spacing: -0.02em; white-space: nowrap; }
.top-bar .sep { width: 1px; height: 16px; background: #374151; }
.preset-tabs { display: flex; gap: 2px; flex: 1; overflow-x: auto; }
.preset-tab {
  padding: 3px 9px; border-radius: 4px; font-size: 10.5px; font-weight: 500;
  background: transparent; border: 1px solid #1f2937; color: #6b7280; cursor: pointer;
  transition: all 0.1s; white-space: nowrap;
}
.preset-tab:hover { background: #1f2937; color: #9ca3af; border-color: #374151; }
.preset-tab.active { background: #1e3a5f; border-color: #2563eb; color: #93c5fd; font-weight: 600; }
.zoom-controls { display: flex; gap: 2px; }
.zoom-btn {
  width: 24px; height: 24px; border-radius: 4px; border: 1px solid #1f2937;
  background: transparent; color: #6b7280; cursor: pointer; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
}
.zoom-btn:hover { background: #1f2937; color: #9ca3af; }

/* Main Layout */
.main { display: flex; flex: 1; overflow: hidden; }

/* Left Panel */
.left-panel {
  width: 220px; flex-shrink: 0; background: #111827; border-right: 1px solid #1f2937;
  display: flex; flex-direction: column; overflow: hidden;
}
.panel-section { padding: 8px 10px; border-bottom: 1px solid #1f2937; }
.panel-title { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #4b5563; margin-bottom: 5px; }
.layer-toggle { display: flex; align-items: center; gap: 6px; padding: 2px 0; cursor: pointer; font-size: 11px; }
.layer-toggle input { accent-color: #3b82f6; }
.layer-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
.layer-label { flex: 1; }
.layer-count { color: #4b5563; font-size: 10px; font-family: 'SF Mono', monospace; }

.conn-toggle { display: flex; align-items: center; gap: 6px; padding: 2px 0; cursor: pointer; font-size: 11px; }
.conn-toggle input { accent-color: #3b82f6; }
.conn-line { width: 16px; height: 2px; flex-shrink: 0; border-radius: 1px; }

/* Comments Section */
.comments-section { flex: 1; overflow-y: auto; padding: 8px 10px; }
.comment-item {
  padding: 6px 8px; margin-bottom: 4px; border-radius: 4px;
  background: #1f2937; border: 1px solid #374151; font-size: 10px;
}
.comment-target { color: #93c5fd; font-weight: 600; font-size: 9px; }
.comment-file { color: #4b5563; font-size: 9px; font-family: 'SF Mono', monospace; }
.comment-text { color: #9ca3af; margin-top: 2px; line-height: 1.3; }
.comment-del { float: right; cursor: pointer; color: #4b5563; font-size: 10px; }
.comment-del:hover { color: #ef4444; }
.no-comments { color: #374151; font-size: 10px; font-style: italic; text-align: center; padding: 12px 0; }

/* Canvas */
.canvas-area { flex: 1; position: relative; overflow: hidden; background: #0a0e1a; }
.canvas-area svg { width: 100%; height: 100%; }

/* Legend */
.legend {
  position: absolute; bottom: 8px; left: 8px; background: #111827ee; border: 1px solid #1f2937;
  border-radius: 6px; padding: 6px 10px; display: flex; gap: 12px; font-size: 9px; color: #6b7280;
}
.legend-item { display: flex; align-items: center; gap: 4px; }
.legend-line { width: 16px; height: 2px; border-radius: 1px; }

/* Bottom Panel */
.bottom-panel {
  background: #111827; border-top: 1px solid #1f2937;
  max-height: 140px; display: flex; flex-direction: column; flex-shrink: 0;
}
.bottom-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 4px 10px; border-bottom: 1px solid #1f2937;
}
.bottom-header span { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #4b5563; }
.copy-btn {
  padding: 2px 8px; border-radius: 3px; font-size: 10px; font-weight: 500;
  background: #1e3a5f; border: 1px solid #2563eb; color: #93c5fd; cursor: pointer;
}
.copy-btn:hover { background: #2563eb; color: #fff; }
.copy-btn.copied { background: #065f46; border-color: #10b981; color: #6ee7b7; }
.prompt-output {
  padding: 6px 10px; font-size: 11px; line-height: 1.5; color: #9ca3af;
  overflow-y: auto; flex: 1; font-family: 'SF Mono', 'Fira Code', monospace;
  white-space: pre-wrap;
}

/* Comment Modal */
.modal-overlay {
  position: fixed; inset: 0; background: #000a; z-index: 100;
  display: none; align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: #1f2937; border: 1px solid #374151; border-radius: 8px;
  padding: 16px; width: 340px; max-width: 90vw;
}
.modal h3 { font-size: 13px; font-weight: 600; color: #f1f5f9; margin-bottom: 2px; }
.modal .modal-file { font-size: 10px; color: #6b7280; font-family: 'SF Mono', monospace; margin-bottom: 10px; }
.modal textarea {
  width: 100%; height: 70px; background: #111827; border: 1px solid #374151;
  border-radius: 4px; color: #e5e7eb; font-size: 11px; padding: 8px; resize: none;
  font-family: system-ui;
}
.modal textarea:focus { outline: none; border-color: #3b82f6; }
.modal-actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 8px; }
.modal-btn {
  padding: 4px 12px; border-radius: 4px; font-size: 11px; cursor: pointer; border: 1px solid transparent;
}
.modal-btn.cancel { background: #374151; color: #9ca3af; border-color: #4b5563; }
.modal-btn.save { background: #2563eb; color: #fff; }
.modal-btn:hover { opacity: 0.85; }

/* Node tooltip */
.node-tooltip {
  position: fixed; background: #1f2937ee; border: 1px solid #374151; border-radius: 6px;
  padding: 6px 10px; font-size: 10px; color: #d1d5db; pointer-events: none;
  z-index: 50; display: none; max-width: 260px; line-height: 1.4;
}
.node-tooltip .tt-label { font-weight: 600; color: #f1f5f9; }
.node-tooltip .tt-file { color: #6b7280; font-family: 'SF Mono', monospace; font-size: 9px; }
.node-tooltip .tt-desc { margin-top: 3px; color: #9ca3af; }
</style>
</head>
<body>

<div class="top-bar">
  <h1>AgentPane Architecture</h1>
  <div class="sep"></div>
  <div class="preset-tabs" id="presetTabs"></div>
  <div class="zoom-controls">
    <button class="zoom-btn" onclick="zoomIn()">+</button>

    <button class="zoom-btn" onclick="zoomOut()">−</button>
  </div>
</div>

<div class="main">

  <div class="canvas-area" id="canvasArea">

    <div class="legend" id="legend"></div>
  </div>
</div>

<div class="bottom-panel">
  <div class="bottom-header">

    <button class="copy-btn" id="copyBtn" onclick="copyPrompt()">Copy</button>
  </div>
  <div class="prompt-output" id="promptOutput"></div>
</div>

<div class="modal-overlay" id="commentModal">

    <div class="modal-file" id="modalFile"></div>
    <textarea id="modalInput" placeholder="Add your feedback or question about this component..."></textarea>
    <div class="modal-actions">

  </div>
</div>

<div class="node-tooltip" id="tooltip"></div>

// =========================================================================
// Presets
// =========================================================================

const PRESETS = {
  'Full System':     { layers: Object.keys(LAYERS), conns: Object.keys(CONN_TYPES) },
  'Agent Flow':      { layers: ['frontend','api','services','agents','external'], conns: ['data-flow','sdk','event'] },
  'Event Pipeline':  { layers: ['api','services','agents','data'], conns: ['data-flow','tool-call','event'], highlight: ['webhook-handler','event-processing','plugin-registry','github-plugin','cron-plugin','template-engine','scheduler','event-bus','event-source-svc','event-sub-svc','db-events','db-event-log','db-sched-exec'] },
  'Frontend':        { layers: ['frontend'], conns: ['data-flow','event'] },
  'Data Layer':      { layers: ['services','data'], conns: ['data-flow'] },
  'Container Agent': { layers: ['services','agents','infra','external'], conns: ['tool-call','sdk','event'], highlight: ['container-agent','docker','k8s','agent-runner','container-bridge','claude-api','stream-handler'] },
};

// =========================================================================
// State
// =========================================================================

const state = {
  layers: Object.fromEntries(Object.keys(LAYERS).map(k => [k, true])),
  conns: Object.fromEntries(Object.keys(CONN_TYPES).map(k => [k, true])),
  highlight: null,
  comments: [],
  zoom: 1,
  panX: 0, panY: 0,
  activePreset: 'Full System',
  modalNode: null,
};

// =========================================================================
// Rendering
// =========================================================================

function renderAll() {
  renderDiagram();
  renderComments();
  updatePrompt();
}

function renderDiagram() {
  const svg = document.getElementById('diagram');
  const area = document.getElementById('canvasArea');
  const W = area.clientWidth;
  const H = area.clientHeight;

  const visibleLayers = new Set(Object.entries(state.layers).filter(([,v]) => v).map(([k]) => k));
  const visibleConns = new Set(Object.entries(state.conns).filter(([,v]) => v).map(([k]) => k));
  const visibleNodes = NODES.filter(n => visibleLayers.has(n.layer));
  const nodeIds = new Set(visibleNodes.map(n => n.id));
  const visibleConnections = CONNECTIONS.filter(c =>
    visibleConns.has(c.type) && nodeIds.has(c.from) && nodeIds.has(c.to)
  );

  // Compute viewBox
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const n of visibleNodes) {
    minX = Math.min(minX, n.x);
    minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x + n.w);
    maxY = Math.max(maxY, n.y + n.h);
  }
  if (!isFinite(minX)) { minX = 0; minY = 0; maxX = 800; maxY = 400; }
  const pad = 30;
  minX -= pad; minY -= pad; maxX += pad; maxY += pad;
  const vw = (maxX - minX) / state.zoom;
  const vh = (maxY - minY) / state.zoom;
  const cx = (minX + maxX) / 2 - state.panX;
  const cy = (minY + maxY) / 2 - state.panY;
  svg.setAttribute('viewBox', `${cx - vw/2} ${cy - vh/2} ${vw} ${vh}`);

  let html = '<defs>';
  for (const [type, cfg] of Object.entries(CONN_TYPES)) {
    html += `<marker id="arrow-${type}" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="${cfg.color}" opacity="0.7"/>
    </marker>`;
  }
  html += '</defs>';

  // Draw connections
  for (const c of visibleConnections) {
    const from = NODES.find(n => n.id === c.from);
    const to = NODES.find(n => n.id === c.to);
    if (!from || !to) continue;

    const cfg = CONN_TYPES[c.type];
    const x1 = from.x + from.w / 2, y1 = from.y + from.h;
    const x2 = to.x + to.w / 2, y2 = to.y;
    const dy = y2 - y1;
    const cp = Math.max(20, Math.abs(dy) * 0.4);

    const dim = state.highlight && (!state.highlight.includes(from.id) || !state.highlight.includes(to.id));
    const opacity = dim ? 0.12 : 0.45;

    html += `<path d="M${x1},${y1} C${x1},${y1+cp} ${x2},${y2-cp} ${x2},${y2}"
      fill="none" stroke="${cfg.color}" stroke-width="1.2" opacity="${opacity}"
      ${cfg.dash ? `stroke-dasharray="${cfg.dash}"` : ''}
      marker-end="url(#arrow-${c.type})"/>`;

    if (c.label) {
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      html += `<text x="${mx}" y="${my - 3}" fill="${cfg.color}" opacity="${opacity + 0.2}"
        font-size="7" text-anchor="middle" font-family="system-ui">${c.label}</text>`;
    }
  }

  // Draw nodes
  for (const n of visibleNodes) {
    const L = LAYERS[n.layer];
    const hasComment = state.comments.some(c => c.target === n.id);
    const dim = state.highlight && !state.highlight.includes(n.id);
    const opacity = dim ? 0.25 : 1;

    html += `<g opacity="${opacity}" class="node" data-id="${n.id}" style="cursor:pointer">
      <rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="5"
        fill="${L.fill}" stroke="${hasComment ? '#f59e0b' : L.border}" stroke-width="${hasComment ? 1.5 : 0.8}"/>
      <text x="${n.x + n.w/2}" y="${n.y + (n.h > 38 ? 16 : 14)}" fill="${L.color}"
        font-size="9" font-weight="600" text-anchor="middle" font-family="system-ui">${n.label}</text>
      <text x="${n.x + n.w/2}" y="${n.y + (n.h > 38 ? 28 : 25)}" fill="#4b5563"
        font-size="7" text-anchor="middle" font-family="SF Mono, monospace">${n.subtitle}</text>
    </g>`;
  }

  svg.innerHTML = html;

  // Attach node events
  svg.querySelectorAll('.node').forEach(g => {
    const id = g.dataset.id;
    g.addEventListener('click', () => openModal(id));
    g.addEventListener('mouseenter', (e) => showTooltip(e, id));
    g.addEventListener('mouseleave', hideTooltip);
  });
}

// =========================================================================
// Controls
// =========================================================================

function renderControls() {
  // Presets
  const tabs = document.getElementById('presetTabs');
  tabs.innerHTML = Object.keys(PRESETS).map(name =>
    `<button class="preset-tab ${state.activePreset === name ? 'active' : ''}"
      onclick="applyPreset('${name}')">${name}</button>`
  ).join('');

  // Layer toggles
  const layerPanel = document.getElementById('layerToggles');
  layerPanel.innerHTML = '<div class="panel-title">Layers</div>' +
    Object.entries(LAYERS).map(([key, cfg]) => {
      const count = NODES.filter(n => n.layer === key).length;
      return `<label class="layer-toggle">
        <input type="checkbox" ${state.layers[key] ? 'checked' : ''}
          onchange="toggleLayer('${key}', this.checked)">
        <span class="layer-dot" style="background:${cfg.color}"></span>
        <span class="layer-label">${cfg.label}</span>
        <span class="layer-count">${count}</span>
      </label>`;
    }).join('');

  // Connection toggles
  const connPanel = document.getElementById('connToggles');
  connPanel.innerHTML = '<div class="panel-title">Connections</div>' +
    Object.entries(CONN_TYPES).map(([key, cfg]) => {
      return `<label class="conn-toggle">
        <input type="checkbox" ${state.conns[key] ? 'checked' : ''}
          onchange="toggleConn('${key}', this.checked)">
        <span class="conn-line" style="background:${cfg.color}; ${cfg.dash ? `background: repeating-linear-gradient(90deg, ${cfg.color} 0 4px, transparent 4px 7px)` : ''}"></span>
        <span class="layer-label">${cfg.label}</span>
      </label>`;
    }).join('');

  // Legend
  const legend = document.getElementById('legend');
  legend.innerHTML = Object.entries(CONN_TYPES).map(([, cfg]) =>
    `<div class="legend-item"><span class="legend-line" style="background:${cfg.color}"></span>${cfg.label}</div>`
  ).join('');
}

function applyPreset(name) {
  const preset = PRESETS[name];
  state.activePreset = name;
  for (const key of Object.keys(LAYERS)) {
    state.layers[key] = preset.layers.includes(key);
  }
  for (const key of Object.keys(CONN_TYPES)) {
    state.conns[key] = preset.conns.includes(key);
  }
  state.highlight = preset.highlight || null;
  state.zoom = 1; state.panX = 0; state.panY = 0;
  renderControls();
  renderAll();
}

function toggleLayer(key, checked) {
  state.layers[key] = checked;
  state.activePreset = '';
  state.highlight = null;
  renderControls();
  renderAll();
}

function toggleConn(key, checked) {
  state.conns[key] = checked;
  state.activePreset = '';
  renderControls();
  renderAll();
}

function zoomIn()    { state.zoom = Math.min(3, state.zoom * 1.25); renderDiagram(); }
function zoomOut()   { state.zoom = Math.max(0.3, state.zoom / 1.25); renderDiagram(); }
function zoomReset() { state.zoom = 1; state.panX = 0; state.panY = 0; renderDiagram(); }

// =========================================================================
// Tooltip
// =========================================================================

function showTooltip(e, id) {
  const node = NODES.find(n => n.id === id);
  if (!node) return;
  const tt = document.getElementById('tooltip');
  tt.innerHTML = `<div class="tt-label">${node.label}</div><div class="tt-file">${node.subtitle}</div><div class="tt-desc">${node.desc}</div>`;
  tt.style.display = 'block';
  tt.style.left = (e.clientX + 12) + 'px';
  tt.style.top = (e.clientY - 10) + 'px';
}

function hideTooltip() {
  document.getElementById('tooltip').style.display = 'none';
}

// =========================================================================
// Comment System
// =========================================================================

function openModal(nodeId) {
  const node = NODES.find(n => n.id === nodeId);
  if (!node) return;
  state.modalNode = node;
  document.getElementById('modalTitle').textContent = node.label;
  document.getElementById('modalFile').textContent = node.subtitle;
  document.getElementById('modalInput').value = '';
  document.getElementById('commentModal').classList.add('open');
  setTimeout(() => document.getElementById('modalInput').focus(), 50);
}

function closeModal() {
  document.getElementById('commentModal').classList.remove('open');
  state.modalNode = null;
}

function saveComment() {
  const text = document.getElementById('modalInput').value.trim();
  if (!text || !state.modalNode) return;
  state.comments.push({
    id: Date.now(),
    target: state.modalNode.id,
    targetLabel: state.modalNode.label,
    targetFile: state.modalNode.subtitle,
    text,
  });
  closeModal();
  renderAll();
}

function deleteComment(id) {
  state.comments = state.comments.filter(c => c.id !== id);
  renderAll();
}

function renderComments() {
  const panel = document.getElementById('commentsPanel');
  const noComments = document.getElementById('noComments');

  // Remove existing comment items
  panel.querySelectorAll('.comment-item').forEach(el => el.remove());

  if (state.comments.length === 0) {
    noComments.style.display = '';
    return;
  }
  noComments.style.display = 'none';

  for (const c of state.comments) {
    const el = document.createElement('div');
    el.className = 'comment-item';
    el.innerHTML = `<span class="comment-del" onclick="deleteComment(${c.id})">×</span>
      <div class="comment-target">${c.targetLabel}</div>
      <div class="comment-file">${c.targetFile}</div>
      <div class="comment-text">${c.text}</div>`;
    panel.appendChild(el);
  }
}

// =========================================================================
// Prompt Output
// =========================================================================

function updatePrompt() {
  const output = document.getElementById('promptOutput');
  const parts = [];

  const visibleLayerNames = Object.entries(state.layers)
    .filter(([,v]) => v).map(([k]) => LAYERS[k].label);
  const allVisible = visibleLayerNames.length === Object.keys(LAYERS).length;

  if (state.activePreset && state.activePreset !== 'Full System') {
    parts.push(`Viewing the "${state.activePreset}" perspective of the AgentPane architecture.`);
  } else if (!allVisible) {
    parts.push(`Viewing ${visibleLayerNames.join(', ')} layers of the AgentPane architecture.`);
  } else {
    parts.push('Full AgentPane architecture overview.');
  }

  // Architecture summary
  parts.push('');
  parts.push('Tech stack: Bun + TanStack Start + Hono + SQLite/Drizzle + Claude Agent SDK + Radix/Tailwind.');
  parts.push('Key patterns: File-based routing, Result<T,E> error handling, SSE streaming via Durable Streams, plugin-based event system, CAS-locked cron scheduler, sandboxed agent execution (Docker/K8s).');

  if (state.comments.length > 0) {
    parts.push('');
    parts.push('Feedback on specific components:');
    for (const c of state.comments) {
      parts.push('');
      parts.push(`**${c.targetLabel}** (${c.targetFile}):`);
      parts.push(c.text);
    }
  }

  output.textContent = parts.join('\n');
}

function copyPrompt() {
  const text = document.getElementById('promptOutput').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
  });
}

// =========================================================================
// Pan with mouse drag
// =========================================================================

let isDragging = false, dragStartX, dragStartY, panStartX, panStartY;
const canvasArea = document.getElementById('canvasArea');
canvasArea.addEventListener('mousedown', (e) => {
  if (e.target.closest('.node')) return;
  isDragging = true;
  dragStartX = e.clientX; dragStartY = e.clientY;
  panStartX = state.panX; panStartY = state.panY;
  canvasArea.style.cursor = 'grabbing';
});
window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const dx = (e.clientX - dragStartX) / state.zoom;
  const dy = (e.clientY - dragStartY) / state.zoom;
  state.panX = panStartX + dx;
  state.panY = panStartY + dy;
  renderDiagram();
});
window.addEventListener('mouseup', () => {
  isDragging = false;
  canvasArea.style.cursor = '';
});

// Scroll zoom
canvasArea.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (e.deltaY < 0) zoomIn(); else zoomOut();
}, { passive: false });

// Escape closes modal
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && document.getElementById('commentModal').classList.contains('open')) saveComment();
});

// =========================================================================
// Init
// =========================================================================

renderControls();
renderAll();
</script>
