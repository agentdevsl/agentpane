<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentPane Architecture</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0f172a; color: #e5e7eb;
  font-family: system-ui, -apple-system, sans-serif;
  height: 100vh; display: flex; flex-direction: column; overflow: hidden;
}
.top-bar {
  background: #1e293b; border-bottom: 1px solid #334155;
  padding: 8px 16px; display: flex; align-items: center; gap: 12px; flex-shrink: 0;
}
.top-bar h1 { font-size: 14px; font-weight: 700; color: #f1f5f9; letter-spacing: -0.01em; white-space: nowrap; }
.view-tabs { display: flex; gap: 3px; flex: 1; }
.view-tab {
  padding: 4px 10px; border-radius: 5px; font-size: 11px; font-weight: 500;
  background: #0f172a; border: 1px solid #334155; color: #94a3b8; cursor: pointer;
  transition: all 0.12s; white-space: nowrap;
}
.view-tab:hover { background: #1e293b; color: #cbd5e1; border-color: #475569; }
.view-tab.active { background: #1d4ed8; border-color: #3b82f6; color: #fff; font-weight: 600; }
.main { display: flex; flex: 1; overflow: hidden; }

/* Left Panel */
.left-panel {
  width: 210px; min-width: 210px; background: #1e293b;
  border-right: 1px solid #334155; display: flex; flex-direction: column; overflow: hidden;
}
.panel-section { padding: 10px 12px; border-bottom: 1px solid #334155; }
.panel-section h3 {
  font-size: 9.5px; font-weight: 600; color: #64748b;
  text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px;
}
.preset-btn {
  display: block; width: 100%; padding: 5px 9px; margin-bottom: 3px;
  background: #0f172a; border: 1px solid #334155; border-radius: 5px;
  color: #cbd5e1; font-size: 11px; text-align: left; cursor: pointer; transition: all 0.12s;
}
.preset-btn:hover { background: #1e293b; border-color: #475569; }
.preset-btn.active { background: #1d4ed8; border-color: #3b82f6; color: #fff; font-weight: 600; }
.toggle-row { display: flex; align-items: center; padding: 3px 0; }
.toggle-row label {
  display: flex; align-items: center; gap: 7px;
  font-size: 10.5px; color: #cbd5e1; cursor: pointer; user-select: none;
}
.layer-swatch { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
.conn-line { width: 18px; height: 2px; flex-shrink: 0; border-radius: 1px; }
input[type="checkbox"] { width: 12px; height: 12px; accent-color: #3b82f6; cursor: pointer; }
.comments-panel { flex: 1; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
.comments-list { flex: 1; overflow-y: auto; }
.comment-item {
  padding: 8px 12px; border-bottom: 1px solid #0f172a; position: relative;
}
.ci-target { font-size: 10px; font-weight: 600; color: #fbbf24; margin-bottom: 2px; }
.ci-text { font-size: 10.5px; color: #94a3b8; white-space: pre-wrap; word-break: break-word; padding-right: 18px; }
.ci-del {
  position: absolute; top: 6px; right: 6px; background: none; border: none;
  color: #475569; cursor: pointer; font-size: 15px; padding: 1px 4px; border-radius: 3px; line-height: 1;
}
.ci-del:hover { color: #f87171; background: #1e293b; }
.no-comments { padding: 14px 12px; font-size: 10.5px; color: #475569; font-style: italic; line-height: 1.5; }

/* Right Panel */
.right-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.canvas-area { flex: 1; position: relative; overflow: hidden; background: #020617; }
.zoom-controls {
  position: absolute; top: 10px; right: 10px; z-index: 10; display: flex; gap: 4px;
}
.zoom-btn {
  width: 26px; height: 26px; background: #1e293b; border: 1px solid #334155;
  border-radius: 5px; color: #cbd5e1; cursor: pointer; font-size: 13px;
  display: flex; align-items: center; justify-content: center;
}
.zoom-btn:hover { background: #334155; }
.svg-scroller { width: 100%; height: 100%; overflow: auto; }
.node-group { cursor: pointer; }
.node-group:hover .node-rect { filter: brightness(1.12); }

/* API Table View */
.api-view-container { width: 100%; height: 100%; overflow-y: auto; padding: 16px; }
.api-group-header {
  background: #1e293b; border: 1px solid #334155; border-radius: 6px;
  padding: 8px 12px; margin-bottom: 4px; cursor: pointer;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 12px; font-weight: 600; color: #e2e8f0;
}
.api-group-header:hover { background: #253348; }
.api-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
.api-table tr { border-bottom: 1px solid #1e293b; }
.api-table tr:hover { background: #0f172a55; }
.api-table td { padding: 6px 10px; font-size: 11px; color: #cbd5e1; cursor: pointer; }
.api-table td:first-child { width: 70px; }
.method-badge {
  display: inline-block; padding: 2px 6px; border-radius: 3px;
  font-size: 9.5px; font-weight: 700; letter-spacing: 0.04em;
}
.badge-GET { background: #14532d; color: #4ade80; }
.badge-POST { background: #1e3a5f; color: #60a5fa; }
.badge-PATCH { background: #451a03; color: #fb923c; }
.badge-DELETE { background: #450a0a; color: #f87171; }
.badge-SSE { background: #2e1065; color: #c084fc; }
.api-path { font-family: monospace; font-size: 10.5px; color: #94a3b8; }
.api-desc { color: #64748b; font-size: 10.5px; }

/* State Machines Grid */
.sm-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; width: 100%; height: 100%; gap: 1px; background: #334155; }
.sm-cell { background: #020617; overflow: hidden; position: relative; }
.sm-cell-title { position: absolute; top: 8px; left: 12px; font-size: 11px; font-weight: 700; opacity: 0.9; }
.sm-cell svg { width: 100%; height: 100%; }

/* Auth view */
.auth-view-container { display: flex; width: 100%; height: 100%; }
.auth-panel { flex: 1; overflow: hidden; }

/* Prompt Area */
.prompt-area {
  background: #1e293b; border-top: 1px solid #334155;
  padding: 9px 14px; min-height: 60px; max-height: 100px;
  display: flex; align-items: flex-start; gap: 10px; flex-shrink: 0;
}
.prompt-text { flex: 1; font-family: monospace; font-size: 10.5px; color: #94a3b8; line-height: 1.55; white-space: pre-wrap; overflow: hidden; }
.copy-btn {
  padding: 5px 12px; background: #1d4ed8; border: none; border-radius: 5px;
  color: #fff; font-size: 11px; cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: background 0.12s;
}
.copy-btn:hover { background: #2563eb; }
.copy-btn.copied { background: #059669; }

/* Modal */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65);
  z-index: 100; align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: #1e293b; border: 1px solid #475569; border-radius: 8px;
  padding: 18px 20px; width: 380px; max-width: 90vw;
}
.modal h4 { font-size: 13px; font-weight: 600; color: #f1f5f9; margin-bottom: 2px; }
.modal-sub { font-size: 10.5px; color: #64748b; font-family: monospace; margin-bottom: 10px; }
.modal textarea {
  width: 100%; height: 80px; background: #0f172a; border: 1px solid #475569;
  border-radius: 5px; color: #e2e8f0; font-size: 11.5px; padding: 8px;
  resize: vertical; font-family: system-ui; outline: none; line-height: 1.5;
}
.modal textarea:focus { border-color: #3b82f6; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
.btn-cancel {
  padding: 5px 12px; background: #334155; border: 1px solid #475569;
  border-radius: 5px; color: #cbd5e1; font-size: 11px; cursor: pointer;
}
.btn-cancel:hover { background: #475569; }
.btn-save {
  padding: 5px 12px; background: #1d4ed8; border: none;
  border-radius: 5px; color: #fff; font-size: 11px; cursor: pointer;
}
.btn-save:hover { background: #2563eb; }
.info-note {
  background: #0f172a; border: 1px solid #334155; border-radius: 4px;
  padding: 6px 9px; font-size: 10px; color: #64748b; margin-top: 4px; line-height: 1.5;
}
</style>
</head>
<body>

<div class="top-bar">
  <h1>AgentPane Architecture</h1>
  <div class="view-tabs">
    <button class="view-tab active" onclick="switchView('overview')">Overview</button>
    <button class="view-tab" onclick="switchView('database')">Database</button>
    <button class="view-tab" onclick="switchView('statemachines')">State Machines</button>
    <button class="view-tab" onclick="switchView('auth')">Auth</button>
    <button class="view-tab" onclick="switchView('api')">API Surface</button>
    <button class="view-tab" onclick="switchView('agentexec')">Agent Execution</button>
    <button class="view-tab" onclick="switchView('infra')">Infrastructure</button>
  </div>
</div>

<div class="main">
  <div class="left-panel" id="left-panel"></div>
  <div class="right-panel">
    <div class="canvas-area" id="canvas-area"></div>
    <div class="prompt-area">
      <div class="prompt-text" id="prompt-text"></div>
      <button class="copy-btn" id="copy-btn" onclick="copyPrompt()">Copy Prompt</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h4 id="modal-title"></h4>
    <div class="modal-sub" id="modal-sub"></div>
    <textarea id="modal-textarea" placeholder="Add a question or note about this component..."></textarea>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveComment()">Save</button>
    </div>
  </div>
</div>

<script>
// ================================================================
// SHARED STATE
// ================================================================
const state = {

  layers: { ui:true, api:true, services:true, core:true, sandbox:true, data:true, external:true },

  // state machines
  activeMachines: { agent:true, task:true, session:true, worktree:true },

  apiMethods: { GET:true, POST:true, PATCH:true, DELETE:true, SSE:true },

// ================================================================
// VIEW 1: OVERVIEW DATA
// ================================================================

const NODE_W = 150, NODE_H = 44;
const COL_X  = [8, 174, 340, 506, 672, 838];
const SVG_W  = 998, SVG_H = 730;
const LAYER_Y = { ui:20, api:120, services:220, core:320, sandbox:420, data:520, external:625 };

const overviewNodes = [
  // UI Layer — major user-facing views
  { id:'kanban',          label:'Kanban Board',         sub:'routes/projects/$projectId',            layer:'ui',       col:0 },

const overviewNodesById = {};

// ================================================================
// MODAL SYSTEM
// ================================================================
function openModal(id, label, sub) {
  currentModal = id;
  document.getElementById('modal-title').textContent = label || id;
  document.getElementById('modal-sub').textContent = sub || '';
  const existing = state.comments.find(c => c.target === id);
  document.getElementById('modal-textarea').value = existing ? existing.text : '';
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('modal-textarea').focus(), 40);
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  currentModal = null;
}
document.getElementById('modal-textarea').addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && e.ctrlKey) saveComment();
});
function saveComment() {
  const text = document.getElementById('modal-textarea').value.trim();
  if (!text) {
    state.comments = state.comments.filter(c => c.target !== currentModal);
  } else {
    const existing = state.comments.find(c => c.target === currentModal);
    if (existing) {
      existing.text = text;
    } else {
      state.comments.push({ id: Date.now(), target: currentModal,
        targetLabel: document.getElementById('modal-title').textContent,
        text });
    }
  }
  closeModal();
  renderView();
}
function deleteComment(id) {
  state.comments = state.comments.filter(c => c.id !== id);
  renderView();
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ================================================================
// SHARED: COMMENTS RENDER
// ================================================================
function renderCommentsSection() {
  const count = state.comments.length;
  let html = `<div class="comments-panel panel-section" style="flex:1;border-bottom:none;padding-bottom:0;">
    <h3>Feedback (${count})</h3>
    <div class="comments-list">`;
  if (count === 0) {
    html += '<div class="no-comments">Click any component to add a question or note</div>';
  } else {
    html += state.comments.map(c => `
      <div class="comment-item">
        <div class="ci-target">${esc(c.targetLabel)}</div>
        <div class="ci-text">${esc(c.text)}</div>
        <button class="ci-del" onclick="deleteComment(${c.id})">x</button>
      </div>`).join('');
  }
  html += '</div></div>';
  return html;
}

function copyPrompt() {
  navigator.clipboard.writeText(document.getElementById('prompt-text').textContent).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = 'Copied!'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy Prompt'; btn.classList.remove('copied'); }, 2000);
  });
}

function switchView(id) {
  state.activeView = id;
  document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.view-tab').forEach(t => {
    if (t.textContent.toLowerCase().replace(/\s+/g,'') === id.toLowerCase().replace(/\s+/g,'') ||
        (id==='overview' && t.textContent==='Overview') ||
        (id==='database' && t.textContent==='Database') ||
        (id==='statemachines' && t.textContent==='State Machines') ||
        (id==='auth' && t.textContent==='Auth') ||
        (id==='api' && t.textContent==='API Surface') ||
        (id==='agentexec' && t.textContent==='Agent Execution') ||
        (id==='infra' && t.textContent==='Infrastructure')
    ) t.classList.add('active');
  });
  renderView();
}

function renderView() {
  switch(state.activeView) {
    case 'overview':    renderOverview(); break;
    case 'database':    renderDatabase(); break;
    case 'statemachines': renderStateMachines(); break;
    case 'auth':        renderAuth(); break;
    case 'api':         renderAPI(); break;
    case 'agentexec':   renderAgentExec(); break;
    case 'infra':       renderInfra(); break;
  }
  renderPrompt();
}

function buildOverviewDefs() {
  return Object.entries(CONN_TYPES).map(([type,def]) =>
    `<marker id="arr-${type}" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 7 2.5, 0 5" fill="${def.color}" opacity="0.85"/>
    </marker>`).join('');
}
function buildLayerBands() {
  return Object.entries(LAYER_Y).map(([layer,y]) => {
    if (!state.layers[layer]) return '';
    const def = LAYERS[layer];
    return `<rect x="0" y="${y-5}" width="${SVG_W}" height="${NODE_H+10}" fill="${def.bg}" rx="0"/>`;
  }).join('');
}
function buildLayerLabels() {
  return Object.entries(LAYER_Y).map(([layer,y]) => {
    if (!state.layers[layer]) return '';
    const def = LAYERS[layer];
    return `<text x="${SVG_W-4}" y="${y+NODE_H/2+4}" text-anchor="end" font-size="9" fill="${def.color}" opacity="0.45" font-family="system-ui" font-weight="600">${def.label.toUpperCase()}</text>`;
  }).join('');
}
function ovNodePos(node) {
  const x = COL_X[node.col], y = LAYER_Y[node.layer];
  return { x, y, cx: x+NODE_W/2, cy: y+NODE_H/2 };
}
function buildOverviewConns() {
  let out = '';
  overviewConns.forEach(conn => {
    if (!state.connTypes[conn.type]) return;
    const src = overviewNodesById[conn.from], dst = overviewNodesById[conn.to];
    if (!src||!dst||!state.layers[src.layer]||!state.layers[dst.layer]) return;
    const sp = ovNodePos(src), dp = ovNodePos(dst);
    const def = CONN_TYPES[conn.type];
    const dash = def.dash ? `stroke-dasharray="${def.dash}"` : '';
    let d;
    if (sp.y === dp.y) {
      const goRight = dp.x > sp.x;
      const sx = goRight ? sp.x+NODE_W : sp.x;
      const dx = goRight ? dp.x : dp.x+NODE_W;
      const sy = sp.y+NODE_H/2;
      const cy = sp.y+NODE_H+18;
      d = `M${sx} ${sy} C${sx+(goRight?28:-28)} ${cy},${dx+(goRight?-28:28)} ${cy},${dx} ${sy}`;
    } else {
      const sx=sp.cx, sy=sp.y+NODE_H, dx=dp.cx, dy=dp.y;
      const my=(sy+dy)/2;
      d = `M${sx} ${sy} C${sx} ${my},${dx} ${my},${dx} ${dy}`;
    }
    out += `<path d="${d}" fill="none" stroke="${def.color}" stroke-width="1.4" ${dash} marker-end="url(#arr-${conn.type})" opacity="0.65"/>`;
  });
  return out;
}
function buildOverviewNodes() {
  return overviewNodes.map(node => {
    if (!state.layers[node.layer]) return '';
    const pos = ovNodePos(node);
    const hasComment = state.comments.some(c => c.target===node.id);
    const def = LAYERS[node.layer];
    const stroke = hasComment ? '#fbbf24' : 'rgba(255,255,255,0.15)';
    const sw = hasComment ? 2 : 1;
    const sub = node.sub.length>26 ? node.sub.slice(0,24)+'...' : node.sub;
    return `<g class="node-group" onclick="openModal('${node.id}','${esc(node.label)}','${esc(node.sub)}')" style="cursor:pointer">
      <title>${node.label}\n${node.sub}</title>
      <rect class="node-rect" x="${pos.x}" y="${pos.y}" width="${NODE_W}" height="${NODE_H}" rx="5" fill="${def.color}" stroke="${stroke}" stroke-width="${sw}"/>
      <text x="${pos.cx}" y="${pos.y+15}" text-anchor="middle" font-size="10" font-weight="600" fill="${def.text}" font-family="system-ui" style="pointer-events:none">${node.label}</text>
      <text x="${pos.cx}" y="${pos.y+31}" text-anchor="middle" font-size="8.5" fill="${def.text}" opacity="0.6" font-family="monospace" style="pointer-events:none">${sub}</text>
      ${hasComment?`<circle cx="${pos.x+NODE_W-7}" cy="${pos.y+7}" r="4.5" fill="#fbbf24"/>`:''}
    </g>`;
  }).join('');
}
function applyPreset(id) {
  const p = PRESETS.find(x=>x.id===id); if(!p)return;
  state.activePreset=id; state.layers={...p.layers}; state.connTypes={...p.connTypes};
  renderOverview(); renderPrompt();
}
function toggleLayer(k,v) { state.layers[k]=v; state.activePreset=null; renderOverview(); renderPrompt(); }
function toggleConnType(k,v) { state.connTypes[k]=v; state.activePreset=null; renderOverview(); renderPrompt(); }
function adjustZoom(view, f) {
  if(view==='overview') { state.zoom=Math.min(2.5,Math.max(0.3,state.zoom*f)); renderOverview(); }
  else if(view==='database') { state.dbZoom=Math.min(2.5,Math.max(0.3,state.dbZoom*f)); renderDatabase(); }
  else if(view==='agentexec') { state.execZoom=Math.min(2.5,Math.max(0.3,state.execZoom*f)); renderAgentExec(); }
  else if(view==='infra') { state.infraZoom=Math.min(2.5,Math.max(0.3,state.infraZoom*f)); renderInfra(); }
}
function resetZoom(view) {
  if(view==='overview') { state.zoom=0.88; renderOverview(); }
  else if(view==='database') { state.dbZoom=0.9; renderDatabase(); }
  else if(view==='agentexec') { state.execZoom=0.9; renderAgentExec(); }
  else if(view==='infra') { state.infraZoom=0.9; renderInfra(); }
}

function buildDBArrows() {

function buildSMGrid() {
  const keys = ['agent','task','session','worktree'];
  return keys.map(k => {
    const m = STATE_MACHINES[k];
    if (!state.activeMachines[k]) {
      return `<div class="sm-cell" style="display:flex;align-items:center;justify-content:center;color:#334155;font-size:12px;">${m.label} (hidden)</div>`;

function buildSMDefs(id, color) {
  return `
    <marker id="sm-arr-${id}" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="${color}" opacity="0.9"/>
    </marker>
    <marker id="sm-arr-err-${id}" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f87171" opacity="0.9"/>
    </marker>`;
}

function smNodeCenter(states, id) {
  const s = states.find(x=>x.id===id);
  if (!s) return {x:0,y:0};
  return { x: s.x+SM_NW/2, y: s.y+SM_NH/2, s };
}

function buildSMArrows(m) {
  let out = '';
  m.transitions.forEach(t => {
    const src = m.states.find(s=>s.id===t.from);
    const dst = m.states.find(s=>s.id===t.to);
    if (!src||!dst) return;
    const sx=src.x+SM_NW/2, sy=src.y+SM_NH/2;
    const dx=dst.x+SM_NW/2, dy=dst.y+SM_NH/2;
    const color = m.color;
    const mid = `sm-arr-${Object.keys(STATE_MACHINES).find(k=>STATE_MACHINES[k]===m)}`;
    let d='', lx=0, ly=0;

    if (t.dir==='right') {
      const startX=src.x+SM_NW, endX=dst.x;
      d=`M${startX} ${src.y+SM_NH/2} L${endX} ${dst.y+SM_NH/2}`;
      lx=(startX+endX)/2; ly=src.y+SM_NH/2-6;
    } else if (t.dir==='left') {
      const startX=src.x, endX=dst.x+SM_NW;
      const ay=src.y-18;
      d=`M${startX} ${src.y+SM_NH/2} C${startX-30} ${ay},${endX+30} ${ay},${endX} ${dst.y+SM_NH/2}`;
      lx=(startX+endX)/2; ly=ay-6;
    } else if (t.dir==='down') {
      const startY=src.y+SM_NH, endY=dst.y;
      d=`M${src.x+SM_NW/2} ${startY} L${dst.x+SM_NW/2} ${endY}`;
      lx=src.x+SM_NW/2+5; ly=(startY+endY)/2;
    } else if (t.dir==='up') {
      const startY=src.y, endY=dst.y+SM_NH;
      d=`M${src.x+SM_NW/2+8} ${startY} L${dst.x+SM_NW/2+8} ${endY}`;
      lx=src.x+SM_NW/2+14; ly=(startY+endY)/2;
    } else if (t.dir==='diag') {
      d=`M${src.x+SM_NW/2} ${src.y+SM_NH} L${dst.x+SM_NW/2} ${dst.y}`;
      lx=(src.x+dst.x)/2+SM_NW/2+5; ly=(src.y+dst.y)/2+SM_NH/2;
    } else if (t.dir==='diag-rev') {
      d=`M${src.x+SM_NW/2} ${src.y} L${dst.x+SM_NW/2} ${dst.y+SM_NH}`;
      lx=(src.x+dst.x)/2+SM_NW/2+5; ly=(src.y+dst.y)/2+SM_NH/2;
    } else if (t.dir==='arc-above') {
      const minX=Math.min(src.x,dst.x), maxX=Math.max(src.x+SM_NW,dst.x+SM_NW);
      const ay=Math.min(src.y,dst.y)-50;
      d=`M${src.x+SM_NW/2} ${src.y} C${src.x+SM_NW/2} ${ay},${dst.x+SM_NW/2} ${ay},${dst.x+SM_NW/2} ${dst.y}`;
      lx=(src.x+dst.x)/2+SM_NW/2; ly=ay-6;
    } else if (t.dir==='arc-below') {
      const ay=Math.max(src.y,dst.y)+SM_NH+40;
      d=`M${src.x+SM_NW/2} ${src.y+SM_NH} C${src.x+SM_NW/2} ${ay},${dst.x+SM_NW/2} ${ay},${dst.x+SM_NW/2} ${dst.y+SM_NH}`;
      lx=(src.x+dst.x)/2+SM_NW/2; ly=ay+8;
    } else if (t.dir==='arc-below2') {
      const ay=Math.max(src.y,dst.y)+SM_NH+60;
      d=`M${src.x+SM_NW/2} ${src.y+SM_NH} C${src.x+SM_NW/2} ${ay},${dst.x+SM_NW/2} ${ay},${dst.x+SM_NW/2} ${dst.y+SM_NH}`;
      lx=(src.x+dst.x)/2+SM_NW/2; ly=ay+8;
    } else if (t.dir==='arc-below-wt') {
      const ay=src.y+SM_NH+80;
      d=`M${src.x+SM_NW/2} ${src.y+SM_NH} C${src.x+SM_NW/2} ${ay},${dst.x+SM_NW/2} ${ay},${dst.x+SM_NW/2} ${dst.y+SM_NH}`;
      lx=(src.x+dst.x)/2+SM_NW/2; ly=ay+8;
    } else {
      d=`M${sx} ${sy} L${dx} ${dy}`;
      lx=(sx+dx)/2; ly=(sy+dy)/2;
    }
    const isBack = t.dir==='left'||t.dir==='arc-below'||t.dir==='arc-below2'||t.dir==='arc-below-wt';
    out += `<path d="${d}" fill="none" stroke="${color}" stroke-width="1.3" ${isBack?'stroke-dasharray="4,2"':''} marker-end="url(#${mid})" opacity="0.8"/>`;
    out += `<text x="${lx}" y="${ly}" text-anchor="middle" font-size="9" fill="#94a3b8" font-family="system-ui">${t.label}</text>`;
  });
  return out;
}

function buildSMNodes(m) {
  return m.states.map(s => {
    let fill='#0f172a', stroke=m.color, sw=1.5;
    if (s.type==='final') { fill='#14532d'; stroke='#4ade80'; }
    else if (s.type==='error') { fill='#450a0a'; stroke='#f87171'; }
    else if (s.type==='initial') { sw=2.5; }
    let inner='';
    if (s.type==='final') {
      inner=`<rect x="${s.x+4}" y="${s.y+4}" width="${SM_NW-8}" height="${SM_NH-8}" rx="4" fill="none" stroke="#4ade80" stroke-width="1"/>`;
    }
    return `<g style="cursor:pointer" onclick="openModal('sm-${m.label.replace(/\s/g,'-')}-${s.id}','${s.label}','${m.label} state')">
      <rect x="${s.x}" y="${s.y}" width="${SM_NW}" height="${SM_NH}" rx="6" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>
      ${inner}
      <text x="${s.x+SM_NW/2}" y="${s.y+SM_NH/2+4}" text-anchor="middle" font-size="10" font-weight="600" fill="${s.type==='error'?'#f87171':s.type==='final'?'#4ade80':m.color}" font-family="system-ui">${s.label}</text>
    </g>`;
  }).join('');
}

        <text x="30" y="${y+23}" text-anchor="middle" font-size="11" font-weight="700" fill="${s.color}" font-family="system-ui">${s.n}</text>
        <text x="50" y="${y+14}" font-size="9.5" fill="#e2e8f0" font-family="system-ui">${s.label}</text>
        <text x="50" y="${y+28}" font-size="8.5" fill="${s.color}" font-family="system-ui">${s.actor}</text>
      </g>`;
    if (i < steps.length-1) {
      const ay=y+38;
      svgContent += `<line x1="30" y1="${ay}" x2="30" y2="${ay+14}" stroke="#334155" stroke-width="1.5" marker-end="url(#oauth-arr)"/>`;
    }
  });
  return `<div style="flex:1;overflow:auto;min-width:420px">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="400" height="450" style="display:block;margin:auto">

        <polygon points="0 0, 7 2.5, 0 5" fill="#334155"/>
      </marker></defs>
      <text x="200" y="12" text-anchor="middle" font-size="11" font-weight="700" fill="#94a3b8" font-family="system-ui">GitHub OAuth Flow</text>
      ${svgContent}
    </svg>
  </div>`;
}

function buildExecSVG() {
  const cols = [
    { label:'User', x:30, color:'#60a5fa' },
    { label:'API Layer', x:195, color:'#fde68a' },
    { label:'Agent Exec Service', x:360, color:'#bbf7d0' },
    { label:'Claude SDK', x:525, color:'#e9d5ff' },
    { label:'Events / DB', x:690, color:'#fbcfe8' },
  ];
  const colW = 140;
  let out = '';

  // Defs
  out += `<defs>
    <marker id="exec-arr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#94a3b8" opacity="0.9"/>
    </marker>
    <marker id="exec-arr-p" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#a78bfa" opacity="0.9"/>
    </marker>
    <marker id="exec-arr-e" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#60a5fa" opacity="0.9"/>
    </marker>
    <marker id="exec-arr-o" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#f97316" opacity="0.9"/>
    </marker>
  </defs>`;

  // Background columns
  cols.forEach(c => {
    out += `<rect x="${c.x}" y="45" width="${colW}" height="710" rx="0" fill="${c.color}08"/>`;
    out += `<rect x="${c.x}" y="0" width="${colW}" height="42" rx="4" fill="${c.color}33"/>`;
    out += `<text x="${c.x+colW/2}" y="25" text-anchor="middle" font-size="10" font-weight="700" fill="${c.color}" font-family="system-ui">${c.label}</text>`;
    out += `<line x1="${c.x}" y1="42" x2="${c.x}" y2="760" stroke="${c.color}22" stroke-width="1" stroke-dasharray="4,4"/>`;
  });

  const BW=130, BH=32;
  function box(colIdx, y, text, phase, id) {
    if (phase==='planning'&&!state.showPlanningPhase) return '';
    if (phase==='execution'&&!state.showExecutionPhase) return '';
    const c=cols[colIdx];
    const bx=c.x+5;
    const color=phase==='planning'?'#a78bfa':phase==='execution'?'#60a5fa':phase==='event'?'#f97316':'#94a3b8';
    const hasComment=state.comments.some(c=>c.target===id);
    return `<g style="cursor:pointer" onclick="openModal('${id}','${esc(text)}','${phase} phase')">
      <rect x="${bx}" y="${y}" width="${BW}" height="${BH}" rx="5" fill="${color}22" stroke="${color}" stroke-width="${hasComment?2:1}"/>
      <text x="${bx+BW/2}" y="${y+BH/2+4}" text-anchor="middle" font-size="9.5" fill="${color}" font-family="system-ui">${esc(text)}</text>
      ${hasComment?`<circle cx="${bx+BW-6}" cy="${y+6}" r="4" fill="#fbbf24"/>`:''}
    </g>`;
  }
  function arrow(x1, y1, x2, y2, label, phase) {
    if (phase==='planning'&&!state.showPlanningPhase) return '';
    if (phase==='execution'&&!state.showExecutionPhase) return '';
    const marker=phase==='planning'?'exec-arr-p':phase==='execution'?'exec-arr-e':phase==='event'?'exec-arr-o':'exec-arr';
    const color=phase==='planning'?'#a78bfa':phase==='execution'?'#60a5fa':phase==='event'?'#f97316':'#94a3b8';
    const mx=(x1+x2)/2, my=(y1+y2)/2;
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="1.3" marker-end="url(#${marker})" opacity="0.8"/>
      ${label?`<text x="${mx}" y="${my-4}" text-anchor="middle" font-size="8.5" fill="${color}" font-family="system-ui">${esc(label)}</text>`:''}`;
  }

  // Steps layout: col indices 0=User,1=API,2=AgentExec,3=SDK,4=Events
  const steps = [
    // [colIdx, y, text, phase, id]
    [0, 55,  'Move task to in_progress', 'user', 'exec-s1'],
    [1, 100, 'PATCH /tasks/:id/move',    'planning', 'exec-s2'],
    [2, 145, 'agentExecSvc.start()',     'planning', 'exec-s3'],
    [2, 195, 'Create git worktree',      'planning', 'exec-s4'],
    [2, 245, 'Create session -> DB',     'planning', 'exec-s5'],
    [4, 245, 'session_events row',       'event', 'exec-s5e'],
    [2, 295, 'runAgentPlanning()',        'planning', 'exec-s6'],
    [3, 340, 'SDK session (plan mode)',   'planning', 'exec-s7'],
    [3, 390, 'Stream turns/chunks',       'planning', 'exec-s8'],
    [4, 390, 'chunk events',             'event', 'exec-s8e'],
    [3, 440, 'ExitPlanMode -> plan ready','planning', 'exec-s9'],
    [4, 440, 'agent:plan_ready event',   'event', 'exec-s9e'],
    [0, 490, 'Plan shown to user',        'planning', 'exec-s10'],
    [0, 540, 'User approves plan',        'user', 'exec-s11'],
    [1, 585, 'POST /approve-plan',        'execution', 'exec-s12'],
    [2, 630, 'runAgentExecution()',       'execution', 'exec-s13'],
    [3, 675, 'SDK session (acceptEdits)', 'execution', 'exec-s14'],
    [4, 720, 'agent:completed event',     'event', 'exec-s15'],
  ];

  steps.forEach(([colIdx, y, text, phase, id]) => {
    out += box(colIdx, y, text, phase, id);
  });

  // Arrows
  const colCx = cols.map(c=>c.x+BW/2+5);
  out += arrow(colCx[0], 55+BH, colCx[1], 100, 'drag-drop', 'user');
  out += arrow(colCx[1], 100+BH, colCx[2], 145, '', 'planning');
  out += arrow(colCx[2], 195, colCx[2], 195, '', 'planning');
  out += arrow(colCx[2], 245+BH/2, cols[4].x+5, 245+BH/2, 'persist', 'event');
  out += arrow(colCx[2], 295+BH, colCx[3], 340, '', 'planning');
  out += arrow(colCx[3], 390+BH/2, cols[4].x+5, 390+BH/2, 'SSE', 'event');
  out += arrow(colCx[3], 440+BH/2, cols[4].x+5, 440+BH/2, 'event', 'event');
  out += arrow(cols[4].x+5, 440+BH/2, colCx[0], 490+BH/2, 'SSE to browser', 'event');
  out += arrow(colCx[0], 540+BH, colCx[1], 585, '', 'execution');
  out += arrow(colCx[1], 585+BH, colCx[2], 630, '', 'execution');
  out += arrow(colCx[2], 630+BH, colCx[3], 675, '', 'execution');
  out += arrow(colCx[3], 675+BH, colCx[4], 720, '', 'event');

  // Phase labels
  if (state.showPlanningPhase) {
    out += `<rect x="5" y="95" width="8" height="350" rx="3" fill="#a78bfa44"/>
    <text x="9" y="275" text-anchor="middle" font-size="9" fill="#a78bfa" font-family="system-ui" transform="rotate(-90,9,275)">PLANNING PHASE</text>`;
  }
  if (state.showExecutionPhase) {
    out += `<rect x="5" y="580" width="8" height="165" rx="3" fill="#60a5fa44"/>
    <text x="9" y="663" text-anchor="middle" font-size="9" fill="#60a5fa" font-family="system-ui" transform="rotate(-90,9,663)">EXEC PHASE</text>`;
  }

  return out;
}

function buildInfraSVG() {
  let out = '';
  out += `<defs>
    <marker id="inf-arr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#60a5fa" opacity="0.8"/>
    </marker>
    <marker id="inf-arr-g" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#22c55e" opacity="0.8"/>
    </marker>
    <marker id="inf-arr-p" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#a78bfa" opacity="0.8"/>
    </marker>
    <marker id="inf-arr-o" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#f97316" opacity="0.8"/>
    </marker>
    <marker id="inf-arr-cy" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#06b6d4" opacity="0.8"/>
    </marker>
    <marker id="inf-arr-r" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#f87171" opacity="0.8"/>
    </marker>
  </defs>`;

  function zone(x,y,w,h,label,color) {
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${color}11" stroke="${color}" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.8"/>
    <text x="${x+10}" y="${y+18}" font-size="10" font-weight="700" fill="${color}" font-family="system-ui" opacity="0.8">${label}</text>`;
  }
  function box(x,y,w,h,label,sub,color,id) {
    const hasComment=state.comments.some(c=>c.target===id);
    const lines = label.split('\n');
    const sublines = (sub||'').split('\n');
    return `<g style="cursor:pointer" onclick="openModal('${id}','${esc(label.replace(/\n/g,' '))}','${esc((sub||'').replace(/\n/g,' '))}')">
      <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="${color}33" stroke="${color}" stroke-width="${hasComment?2:1.2}"/>
      ${lines.map((l,i)=>`<text x="${x+w/2}" y="${y+h/2-((lines.length-1)*7)+i*14}" text-anchor="middle" font-size="10" font-weight="600" fill="${color}" font-family="system-ui">${esc(l)}</text>`).join('')}
      ${sublines[0]?sublines.map((l,i)=>`<text x="${x+w/2}" y="${y+h/2+((lines.length)*7)+i*12}" text-anchor="middle" font-size="8.5" fill="${color}" opacity="0.7" font-family="monospace">${esc(l)}</text>`).join(''):''}
      ${hasComment?`<circle cx="${x+w-6}" cy="${y+6}" r="4" fill="#fbbf24"/>`:''}
    </g>`;
  }
  function arrow(x1,y1,x2,y2,label,color,marker) {
    const mx=(x1+x2)/2,my=(y1+y2)/2;
    const c=color||'#60a5fa', m=marker||'inf-arr';
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="1.3" marker-end="url(#${m})" opacity="0.7"/>
    ${label?`<text x="${mx}" y="${my-5}" text-anchor="middle" font-size="8.5" fill="${c}" font-family="system-ui">${esc(label)}</text>`:''}`;
  }

  // === TOP-DOWN LAYOUT ===
  // Col metrics: 3 columns within Host, each 187w, 11px gap
  // Col1: x=44, Col2: x=242, Col3: x=440, each 187w
  // Col centers: 137, 335, 533

  // Row 0: Browser + TanStack DB Collections (centered)
  const T = 30; // top padding
  out += box(280, T+8, 120, 36, 'Browser', 'React SPA', '#60a5fa', 'inf-browser');
  out += box(410, T+2, 250, 48, 'TanStack DB', 'sessions(7) · tasks(2) · cli(1) · sandbox(1)', '#22d3ee', 'inf-tanstack-db');

  // Row 1: Host Machine zone (3-column grid)
  if (state.showHost) {
    out += zone(30, T+58, 610, 236, 'Frontend', '#22c55e');
    // Row A: Server processes (2 across, full width)
    out += box(44,  T+80, 286, 32, 'Hono API Server', ':3001', '#22c55e', 'inf-hono');
    out += box(341, T+80, 286, 32, 'Durable Streams', 'in-process SSE + persistence', '#f87171', 'inf-durable');
    // Row B: Database abstraction (full width)
    out += box(44, T+122, 583, 32, 'Drizzle ORM', 'DB_MODE: sqlite | postgres', '#06b6d4', 'inf-drizzle');
    // Row C: Data stores (2 columns, no Git Worktrees)
    out += box(44,  T+164, 286, 32, 'SQLite', 'agentpane.db (local)', '#22c55e', 'inf-sqlite');
    out += box(341, T+164, 286, 32, 'pg driver', 'postgres.js', '#06b6d4', 'inf-pg-driver');
    // Row D: Container Agent (full width)
    out += box(44, T+206, 583, 32, 'Container Agent', 'orchestration', '#22c55e', 'inf-container-agent');
    // Row E: Sandbox providers (one per column)
    out += box(44,  T+248, 187, 32, 'Docker Provider', '', '#60a5fa', 'inf-docker-prov');
    out += box(242, T+248, 187, 32, 'K8s Provider', '', '#a78bfa', 'inf-k8s-prov');
    out += box(440, T+248, 187, 32, 'Nomad Provider', '', '#f97316', 'inf-nomad-prov');

    // Internal arrows (all short vertical)
    out += arrow(330, T+96, 341, T+96, '', '#f87171', 'inf-arr-r');    // Hono → Durable (events)
    out += arrow(187, T+112, 187, T+122, '', '#22c55e', 'inf-arr-g');  // Hono → Drizzle
    out += arrow(484, T+112, 484, T+122, '', '#f87171', 'inf-arr-r');  // Durable → Drizzle (persist)
    out += arrow(187, T+154, 187, T+164, '', '#22c55e', 'inf-arr-g');  // Drizzle → SQLite
    out += arrow(484, T+154, 484, T+164, '', '#06b6d4', 'inf-arr-cy'); // Drizzle → pg
    out += arrow(137, T+238, 137, T+248, '', '#60a5fa', 'inf-arr');    // Container → Docker
    out += arrow(335, T+238, 335, T+248, '', '#a78bfa', 'inf-arr-p');  // Container → K8s
    out += arrow(533, T+238, 533, T+248, '', '#f97316', 'inf-arr-o');  // Container → Nomad
    // "persist" label
    out += `<text x="497" y="${T+119}" font-size="7.5" fill="#f87171" font-family="system-ui" opacity="0.7">persist</text>`;
  }

  // PostgreSQL (Remote) — right of Host, connected from Drizzle
  if (state.showPostgres) {
    out += zone(670, T+58, 170, 150, 'PostgreSQL (Remote)', '#06b6d4');
    out += box(682, T+84, 146, 44, 'PostgreSQL', 'DATABASE_URL', '#06b6d4', 'inf-pg-remote');
    out += box(682, T+140, 146, 30, 'Drizzle Migrations', 'migrations-pg/', '#06b6d4', 'inf-pg-migrate');
  }

  // Row 2: Sandbox zones (aligned with Host columns)
  if (state.showDocker) {
    out += zone(44, T+310, 187, 128, 'Docker (Local)', '#60a5fa');
    out += box(56, T+336, 163, 78, 'agent-sandbox\ncontainers', 'Docker socket', '#60a5fa', 'inf-docker-c');
  }
  if (state.showK8s) {
    out += zone(242, T+310, 187, 128, 'K8s Cluster', '#a78bfa');
    out += box(254, T+336, 163, 40, 'K8s Pods', 'gVisor / Kata / runc', '#a78bfa', 'inf-k8s-pods');
    out += box(254, T+384, 163, 30, 'Sandbox CRDs', 'agents.x-k8s.io', '#a78bfa', 'inf-k8s-crds');
  }
  if (state.showNomad) {
    out += zone(440, T+310, 187, 128, 'Nomad Cluster', '#f97316');
    out += box(452, T+336, 163, 40, 'Nomad Jobs', 'Docker driver', '#f97316', 'inf-nomad-jobs');
    out += box(452, T+384, 163, 26, 'Alloc Exec', 'stdio bridge', '#f97316', 'inf-nomad-exec');
  }

  // Row 3: External Services (full width, Anthropic centered under sandbox zones)
  if (state.showExternal) {
    out += zone(30, T+456, 810, 106, 'External Services', '#6b7280');
    // Anthropic wide bar — centered under all 3 sandbox zones
    out += box(44, T+476, 583, 30, 'Anthropic API', 'Claude API (all sandbox containers)', '#a78bfa', 'inf-anthropic');
    // Other services row
    out += box(44,  T+514, 110, 32, 'GitHub API', 'OAuth', '#6b7280', 'inf-github');
    out += box(162, T+514, 110, 32, 'Docker Hub', 'agent-sandbox', '#60a5fa', 'inf-dockerhub');
    out += box(280, T+514, 110, 32, 'npm Registry', 'cli-monitor', '#ef4444', 'inf-npm');
    out += box(398, T+514, 110, 32, 'HCP Terraform', 'terraform.io', '#eab308', 'inf-terraform');
    out += box(516, T+514, 110, 32, 'GitHub OAuth', 'credentials', '#6b7280', 'inf-github-oauth');
  }

  // === ARROWS (all top-down, no crossing) ===

  // Browser → Hono (HTTP), TanStack DB → Durable Streams (SSE)
  if (state.showHost) {
    out += arrow(340, T+44, 187, T+80, 'HTTP', '#60a5fa', 'inf-arr');
    out += arrow(535, T+50, 484, T+80, 'SSE', '#f87171', 'inf-arr-r');
  }

  // Providers → Sandbox zones (perfectly vertical)
  if (state.showHost && state.showDocker) {
    out += arrow(137, T+280, 137, T+310, '', '#60a5fa', 'inf-arr');
  }
  if (state.showHost && state.showK8s) {
    out += arrow(335, T+280, 335, T+310, '', '#a78bfa', 'inf-arr-p');
  }
  if (state.showHost && state.showNomad) {
    out += arrow(533, T+280, 533, T+310, '', '#f97316', 'inf-arr-o');
  }

  // Drizzle ORM → PostgreSQL (L-shaped: right from Drizzle, up, into PG)
  if (state.showHost && state.showPostgres) {
    out += `<path d="M 627 ${T+138} L 655 ${T+138} L 655 ${T+106} L 682 ${T+106}" fill="none" stroke="#06b6d4" stroke-width="1.3" marker-end="url(#inf-arr-cy)" opacity="0.7"/>`;
    out += `<text x="660" y="${T+100}" font-size="7.5" fill="#06b6d4" font-family="system-ui" text-anchor="start" opacity="0.7">DATABASE_URL</text>`;
  }

  // Sandbox zones → Anthropic (straight down, all converge)
  if (state.showDocker && state.showExternal) {
    out += arrow(137, T+438, 137, T+476, '', '#a78bfa', 'inf-arr-p');
  }
  if (state.showK8s && state.showExternal) {
    out += arrow(335, T+438, 335, T+476, '', '#a78bfa', 'inf-arr-p');
  }
  if (state.showNomad && state.showExternal) {
    out += arrow(533, T+438, 533, T+476, '', '#a78bfa', 'inf-arr-p');
  }

  return out;
}

// ================================================================
// PROMPT
// ================================================================
function renderPrompt() {
  let prompt = '';
  switch(state.activeView) {
    case 'overview': {
      const vis = Object.entries(state.layers).filter(([,v])=>v).map(([k])=>LAYERS[k].label);
      const hid = Object.entries(state.layers).filter(([,v])=>!v).map(([k])=>LAYERS[k].label);
      const conns = Object.entries(state.connTypes).filter(([,v])=>v).map(([k])=>CONN_TYPES[k].label);
      prompt = 'AgentPane Architecture Overview';
      if (hid.length===0) prompt += ', showing all 7 layers: '+vis.join(', ');
      else prompt += '. Visible: '+vis.join(', ')+'. Hidden: '+hid.join(', ');
      if (conns.length<4) prompt += '. Connections: '+conns.join(', ');
      break;
    }
    case 'database': {
      const vis = DB_GROUPS.filter(g=>state.dbGroups[g.id]).map(g=>g.label);
      prompt = 'AgentPane Database Schema ERD (dual-mode: SQLite local / PostgreSQL remote via DB_MODE). Showing table groups: '+vis.join(', ')+'.';
      if (state.showFKArrows) prompt += ' FK relationships are shown as arrows. Schema is identical across both modes (Drizzle ORM abstraction).';
      break;
    }
    case 'statemachines': {
      const vis = Object.entries(state.activeMachines).filter(([,v])=>v).map(([k])=>STATE_MACHINES[k].label);
      prompt = 'AgentPane State Machines: '+vis.join(', ')+'.';
      break;
    }
    case 'auth': {
      prompt = 'AgentPane Auth & Security.';
      if (state.showTrustZones) prompt += ' Trust zones: Server (trusted), Browser (session), Sandbox (isolated), External.';
      if (state.showOAuthFlow) prompt += ' OAuth flow: 8-step GitHub OAuth login sequence.';
      break;
    }
    case 'api': {
      const meth = Object.entries(state.apiMethods).filter(([,v])=>v).map(([k])=>k);
      const grps = API_GROUPS.filter(g=>state.apiGroups[g.id]).map(g=>g.label);
      prompt = 'AgentPane API Surface. Methods: '+meth.join(', ')+'. Groups: '+grps.join(', ')+'.';
      break;
    }
    case 'agentexec': {
      prompt = 'AgentPane Agent Execution Flow.';
      if (state.showPlanningPhase) prompt += ' Planning phase: task move -> agent start -> SDK plan session -> ExitPlanMode -> plan_ready event.';
      if (state.showExecutionPhase) prompt += ' Execution phase: user approves -> approve-plan API -> runAgentExecution -> SDK acceptEdits -> agent:completed.';
      break;
    }
    case 'infra': {
      const zones = [];
      if (state.showHost) zones.push('Frontend (Hono API :3001, Drizzle ORM, SQLite local, pg driver, Durable Streams SSE, Providers)');
      if (state.showDocker) zones.push('Docker (Local, via Docker socket)');
      if (state.showK8s) zones.push('K8s Cluster (remote, CRDs + gVisor/Kata)');
      if (state.showNomad) zones.push('Nomad Cluster (remote, HTTP :4646)');
      if (state.showPostgres) zones.push('PostgreSQL (remote, DATABASE_URL, Drizzle migrations)');
      if (state.showExternal) zones.push('External (Anthropic, GitHub, Docker Hub, npm, HCP Terraform)');
      prompt = 'AgentPane Infrastructure Topology. Zones: '+zones.join(', ')+'.';
      break;
    }
  }
  if (state.comments.length > 0) {
    prompt += '\n\nFeedback:\n';
    state.comments.forEach(c => {
      prompt += `\n[${c.targetLabel}]: ${c.text}\n`;
    });
  }
  document.getElementById('prompt-text').textContent = prompt;
}

// ================================================================
// INIT
// ================================================================
switchView('overview');
</script>
