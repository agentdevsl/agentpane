# AgentPane Default SandboxTemplate
# Defines the default pod template for Agent Sandbox CRD instances.
# The CRD controller uses this template when creating sandbox pods,
# applying the specified container image, resource limits, security
# context, and network policy.
#
# This replaces the manual pod spec building from Phase 1 k8s-provider.ts
# with a declarative CRD resource managed by the cluster controller.
#
# v0.2.1: SandboxTemplate moved to extensions API group
apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxTemplate
metadata:
  name: agentpane-default
  namespace: agentpane-sandboxes
  labels:
    app.kubernetes.io/name: agentpane
    app.kubernetes.io/component: sandbox
    agentpane.io/managed: "true"
  annotations:
    agentpane.io/description: "Default sandbox template for AgentPane agent execution"
spec:
  podTemplate:
    metadata: {}
    spec:
      runtimeClassName: gvisor
      containers:
        - name: sandbox
          # theme-04 P0-01 / arch29-W1-C: digest-pinned to prevent supply-chain
          # attacks via mutable tags. Must match SANDBOX_DEFAULTS.image in
          # src/lib/sandbox/types.ts. Rotation procedure documented there.
          image: docker.io/srlynch1/agent-sandbox@sha256:9b04cfd8f030360efb7fbd1023ce79b228b61edf82dbc0d82c38c867633d4126
          resources:
            requests:
              memory: "2Gi"
              cpu: "1"
            limits:
              memory: "4Gi"
              cpu: "2"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: workspace
              mountPath: /home/node/workspace
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 10Gi
  networkPolicyManagement: Managed
  networkPolicy:
    egress:
      - ports:
          - port: 443
            protocol: TCP
          - port: 80
            protocol: TCP
