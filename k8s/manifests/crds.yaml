---
# Agent Sandbox CRD definitions
# These define the custom resource types for the Agent Sandbox controller
#
# v0.2.1 API group split:
#   - Sandbox stays under agents.x-k8s.io
#   - SandboxTemplate, SandboxClaim, SandboxWarmPool move to extensions.agents.x-k8s.io
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxes.agents.x-k8s.io
spec:
  group: agents.x-k8s.io
  names:
    kind: Sandbox
    listKind: SandboxList
    plural: sandboxes
    singular: sandbox
    shortNames:
      - sandbox
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                podTemplate:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                volumeClaimTemplates:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                shutdownTime:
                  type: string
                  format: date-time
                shutdownPolicy:
                  type: string
                  enum:
                    - Delete
                    - Retain
                replicas:
                  type: integer
                  minimum: 0
                  maximum: 1
            status:
              type: object
              properties:
                serviceFQDN:
                  type: string
                service:
                  type: string
                replicas:
                  type: integer
                selector:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
          x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
        scale:
          specReplicasPath: .spec.replicas
          statusReplicasPath: .status.replicas
          labelSelectorPath: .status.selector
      additionalPrinterColumns:
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Replicas
          type: integer
          jsonPath: .status.replicas
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxtemplates.extensions.agents.x-k8s.io
spec:
  group: extensions.agents.x-k8s.io
  names:
    kind: SandboxTemplate
    listKind: SandboxTemplateList
    plural: sandboxtemplates
    singular: sandboxtemplate
    shortNames:
      - sandboxtemplate
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                podTemplate:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                networkPolicyManagement:
                  type: string
                  enum:
                    - Managed
                    - Unmanaged
                networkPolicy:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
          x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxclaims.extensions.agents.x-k8s.io
spec:
  group: extensions.agents.x-k8s.io
  names:
    kind: SandboxClaim
    listKind: SandboxClaimList
    plural: sandboxclaims
    singular: sandboxclaim
    shortNames:
      - sandboxclaim
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                sandboxTemplateRef:
                  type: object
                  properties:
                    name:
                      type: string
                  required:
                    - name
                lifecycle:
                  type: object
                  properties:
                    shutdownTime:
                      type: string
                      format: date-time
                    shutdownPolicy:
                      type: string
                      enum:
                        - Delete
                        - Retain
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                sandbox:
                  type: object
                  properties:
                    Name:
                      type: string
          x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Sandbox
          type: string
          jsonPath: .status.sandbox.Name
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxwarmpools.extensions.agents.x-k8s.io
spec:
  group: extensions.agents.x-k8s.io
  names:
    kind: SandboxWarmPool
    listKind: SandboxWarmPoolList
    plural: sandboxwarmpools
    singular: sandboxwarmpool
    shortNames:
      - swp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                sandboxTemplateRef:
                  type: object
                  properties:
                    name:
                      type: string
                  required:
                    - name
                replicas:
                  type: integer
                  minimum: 0
            status:
              type: object
              properties:
                replicas:
                  type: integer
                readyReplicas:
                  type: integer
          x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
        scale:
          specReplicasPath: .spec.replicas
          statusReplicasPath: .status.replicas
      additionalPrinterColumns:
        - name: Ready
          type: integer
          jsonPath: .status.readyReplicas
        - name: Desired
          type: integer
          jsonPath: .spec.replicas
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
